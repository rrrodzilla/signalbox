# signalbox — one engine, many concurrent runs.
#
# Run identity is a NATURAL KEY in the payload (run_id / stage_id / shard_id),
# never correlation_id: launches arrive over HTTP, which stamps no correlation,
# and one long-lived engine would collide every run into a single bucket.
# correlation_id stays useful for event-store queries. It is not an item key.
#
# Nothing here sequences anything. A stage opens only from plan acceptance or
# the preceding stage's merge because stage N+1 genuinely depends on N. Shards
# inside a stage are disjoint by an invariant check-plan enforces, so they are
# split with the SDK splitter and are all in flight at once.

[engine]
name = "signalbox"
socket_path = "auto"
api_port = 8890

[event_store]
json_log_dir = "auto"
sqlite_path = "auto"
retention_days = 90

# ─────────────────────────────────────────────────────────────────────────────
# SOURCES
# ─────────────────────────────────────────────────────────────────────────────

# The single actuator. Launches, every emission from a working agent, and human
# approvals all arrive here as POSTs shaped {"event": "<topic>", ...fields}.
# Loopback only: whatever can POST here drives the system.
[[sources]]
name = "control"
path = "~/.local/share/emergent/primitives/bin/http-source"
args = ["--host", "127.0.0.1", "--port", "8100", "--path", "/emit"]
publishes = ["http.request"]

# GitHub's own notification, rather than us asking. `gh webhook forward` tunnels
# deliveries here, so a concluded check suite arrives as an event within a second
# instead of being discovered by the next poll.
#
# This replaced a 45s interval poller that called `gh pr list` on every tick and
# recomputed a conclusion GitHub had already computed. The poller was also where
# issue #56 lived: `--head "signalbox/"` matches a branch name exactly, never a
# prefix, so it silently found nothing.
#
# Both http-sources publish `http.request` — the primitive's topic is fixed — so
# every router below distinguishes them by shape. Control POSTs carry `.body.event`
# and GitHub deliveries carry an `x-github-event` header.
[[sources]]
name = "github"
path = "~/.local/share/emergent/primitives/bin/http-source"
args = ["--host", "127.0.0.1", "--port", "8104", "--path", "/github"]
publishes = ["http.request"]

# Silence has to have a name. An agent that crashes, refuses, or emits nothing
# produces no event at all; this turns that absence into one.
[[sources]]
name = "reap-shards"
path = "~/.local/share/emergent/primitives/bin/exec-source"
args = ["--interval", "60000", "--shell", "bash", "--command",
  "signalbox reap --kind shard --stale-minutes 20"]
publishes = ["exec.output", "exec.exit"]

# The push path's blind spot. A webhook makes arrivals observable and silence
# invisible: a missing workflow, a revoked hook, and a dropped delivery are all
# indistinguishable from "still building", because in every case the number of
# events is zero. Moving to push does not remove this reaper, it is what makes it
# necessary. Forty minutes is a deliberate multiple of the 10-minute CI timeout.
[[sources]]
name = "reap-prs"
path = "~/.local/share/emergent/primitives/bin/exec-source"
args = ["--interval", "300000", "--shell", "bash", "--command",
  "signalbox reap --kind pr --stale-minutes 40"]
publishes = ["exec.output", "exec.exit"]

# ─────────────────────────────────────────────────────────────────────────────
# INGRESS ROUTERS — one topic per thing an agent or human can announce.
# The agent's action space is exactly this vocabulary.
# ─────────────────────────────────────────────────────────────────────────────

[[handlers]]
name = "route-run-requested"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "http.request", "--publish-as", "run.requested", "--",
        "jq", "-c", 'select(.body.event == "run.requested") | .body']
subscribes = ["http.request"]
publishes = ["run.requested"]

[[handlers]]
name = "route-file-written"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "http.request", "--publish-as", "shard.file-written", "--",
        "jq", "-c", 'select(.body.event == "shard.file-written") | .body']
subscribes = ["http.request"]
publishes = ["shard.file-written"]

[[handlers]]
name = "route-check-ran"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "http.request", "--publish-as", "shard.check-ran", "--",
        "jq", "-c", 'select(.body.event == "shard.check-ran") | .body']
subscribes = ["http.request"]
publishes = ["shard.check-ran"]

[[handlers]]
name = "route-shard-submitted"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "http.request", "--publish-as", "shard.submitted", "--",
        "jq", "-c", 'select(.body.event == "shard.submitted") | .body']
subscribes = ["http.request"]
publishes = ["shard.submitted"]

[[handlers]]
name = "route-approval-granted"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "http.request", "--publish-as", "approval.granted", "--",
        "jq", "-c", 'select(.body.event == "approval.granted") | .body']
subscribes = ["http.request"]
publishes = ["approval.granted"]

# Invocation provenance re-enters through control, so this exclusive edge is
# load-bearing evidence that every non-deterministic act actually happened.
[[handlers]]
name = "route-model-invoked"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "http.request", "--publish-as", "model.invoked", "--",
        "jq", "-c", 'select(.body.event == "model.invoked") | .body']
subscribes = ["http.request"]
publishes = ["model.invoked"]

# Anything POSTed that is not recognised vocabulary becomes an event rather
# than a silent drop. Untrusted input, treated as such.
#
# The header guard is load-bearing. GitHub deliveries share this topic and carry
# no `.body.event`, so without it every webhook would also be reported here as an
# unknown emission — a real event, wrongly, on every CI conclusion.
# The model event is load-bearing known vocabulary; omitting it would turn every
# provenance record into a simultaneous false control-plane alarm.
[[handlers]]
name = "route-unknown-emission"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "http.request", "--publish-as", "control.unknown-event", "--",
        "jq", "-c", 'select(.headers["x-github-event"] == null) | select((.body.event // "") | IN("run.requested","shard.file-written","shard.check-ran","shard.submitted","approval.granted","model.invoked") | not) | .body']
subscribes = ["http.request"]
publishes = ["control.unknown-event"]

# GitHub's push notification for a concluded check suite, turned into the
# vocabulary the promote path already speaks.
#
# Two conclusions are dropped rather than routed. `cancelled` and `stale` mean
# superseded, which the workflow's own cancel-in-progress produces on every
# amended push — routing them as failures would open a spurious fix loop against
# work that was never judged. A suite with no associated PR is dropped for the
# same reason: there is nothing to merge, so it is not a promote signal. Both
# absences are covered by the pr reaper rather than assumed benign.
[[handlers]]
name = "route-check-suite"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "http.request", "--publish-as", "checks.observed", "--",
        "jq", "-c", '''select(.headers["x-github-event"] == "check_suite")
        | select(.body.action == "completed")
        | .body.repository.full_name as $repo
        | .body.check_suite
        | select((.head_branch // "") | startswith("signalbox/run-"))
        | select(((.conclusion // "") | ascii_upcase) | IN("CANCELLED", "STALE") | not)
        | select((.pull_requests | length) > 0)
        | {pr: .pull_requests[0].number,
           run_id: (.head_branch | ltrimstr("signalbox/run-")),
           repo: $repo,
           sha: .head_sha,
           check_runs_url: .check_runs_url,
           conclusion: (if ((.conclusion // "") | ascii_upcase)
                           | IN("SUCCESS", "NEUTRAL", "SKIPPED")
                        then "success" else "failure" end)}''']
subscribes = ["http.request"]
publishes = ["checks.observed"]

# A webhook knows about a commit, not about a run. It cannot carry `issue` or
# `base_sha`, which the notes stage downstream of pr.merged needs, so identity is
# restored from the marker `pr.opened` wrote rather than reconstructed. Clearing
# that marker is the same act: a suite that concluded is not a silent one.
[[handlers]]
name = "rehydrate-pr"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "checks.observed", "--publish-as", "checks.reported",
        "-e", "checks.unknown-pr", "-t", "15000", "--",
        "signalbox", "rehydrate", "--kind", "pr"]
subscribes = ["checks.observed"]
publishes = ["checks.reported", "checks.unknown-pr"]

# Two reapers now share `exec.output`, so each selector names its own kind. A
# bare test("reap") matched both and would have published a stalled PR as
# `shard.silent`.
[[handlers]]
name = "raise-reaped"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "exec.output", "--publish-as", "shard.silent", "--",
        "jq", "-c", 'select(.command | test("reap --kind shard")) | .stdout | select(length > 0) | fromjson']
subscribes = ["exec.output"]
publishes = ["shard.silent"]

[[handlers]]
name = "raise-pr-reaped"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "exec.output", "--publish-as", "checks.silent", "--",
        "jq", "-c", 'select(.command | test("reap --kind pr")) | .stdout | select(length > 0) | fromjson']
subscribes = ["exec.output"]
publishes = ["checks.silent"]

# ─────────────────────────────────────────────────────────────────────────────
# PLAN — one judgment gathers its own inputs; a second, from a different
# runner, tries to break the result before any shard is opened.
# ─────────────────────────────────────────────────────────────────────────────

# One worktree per run, branched from a pinned base sha. The base branch moves
# while a run is in flight; a run that re-read it later would land against a
# tree it never saw.
[[handlers]]
name = "prepare-workspace"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "run.requested", "--publish-as", "workspace.ready",
        "-e", "workspace.failed", "-t", "60000", "--",
        "signalbox", "prepare-workspace"]
subscribes = ["run.requested"]
publishes = ["workspace.ready", "workspace.failed"]

[[handlers]]
name = "fetch-issue"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "workspace.ready", "--publish-as", "issue.fetched",
        "-e", "issue.fetch-failed", "-t", "30000", "--",
        "signalbox", "fetch-issue"]
subscribes = ["workspace.ready"]
publishes = ["issue.fetched", "issue.fetch-failed"]

# Surveying the codebase and recalling the vault were two topology roles joined
# on a 620s rendezvous. That machinery bought nothing it could not have had for
# free: the surveying agent already fanned out into its own subagents, so the
# engine was never orchestrating breadth — only two processes and a barrier.
#
# What the barrier did add was a way to lose. sb-62 died on it. The survey arm
# overran its ten-minute budget; the timeout published a failure carrying no
# run_id to attach it to (#66); the join reached its deadline holding one of two
# arms and halted the run for want of an input the agent was still producing —
# and went on producing for six more minutes, because a timeout here abandons
# the wait without killing the process.
#
# So the drafting judgment gathers its own inputs. Fable reads the issue,
# dispatches subagents to survey the tree and read the vault, and drafts from
# what they return. One process, one budget, one failure, and no rendezvous to
# lose a run in.
#
# plan.rejected re-entering here is FEEDBACK EDGE 1: a first draft and a redraft
# are the same act, so one primitive serves both.
[[handlers]]
name = "draft-plan"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "issue.fetched", "-s", "plan.rejected",
        "--publish-as", "plan.submitted", "-e", "plan.draft-failed",
        "-t", "1500000", "--", "signalbox", "agent", "plan"]
subscribes = ["issue.fetched", "plan.rejected"]
# Provenance is load-bearing beside the verdict: success alone cannot prove
# which model invocation incurred the judgment. Redrafts are non-deterministic
# too, so it must survive every feedback pass rather than only the first plan.
publishes = ["plan.submitted", "plan.draft-failed", "model.invoked"]

# The deterministic gate, and it runs FIRST, before any model is asked its
# opinion. Shard file-disjointness within a stage is what licenses splitting a
# stage into events that all run at once, so it is not a thing to put to a vote:
# a persuasive plan whose shards overlap is still a race. A plan that fails here
# never reaches the auditor, because there is nothing to argue about with a plan
# that is malformed.
[[handlers]]
name = "check-plan"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "plan.submitted", "--publish-as", "plan.checked", "--",
        "signalbox", "check-plan"]
subscribes = ["plan.submitted"]
publishes = ["plan.checked"]

[[handlers]]
name = "route-plan-verified"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "plan.checked", "--publish-as", "plan.verified", "--",
        "jq", "-c", "select(.ok == true)"]
subscribes = ["plan.checked"]
publishes = ["plan.verified"]

# Both sides of the guard are exclusive. An unbounded feedback loop is the one
# failure mode of this architecture that fills a disk.
[[handlers]]
name = "route-plan-retry"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "plan.checked", "--publish-as", "plan.rejected", "--",
        "jq", "-c", "select(.ok == false and .attempt < 3)"]
subscribes = ["plan.checked"]
publishes = ["plan.rejected"]

[[handlers]]
name = "route-plan-exhausted"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "plan.checked", "--publish-as", "run.halted", "--",
        "jq", "-c", 'select(.ok == false and .attempt >= 3) | . + {reason: "plan never satisfied its invariants"}']
subscribes = ["plan.checked"]
publishes = ["run.halted"]

# The adversarial pass, and the reason it is worth a second model call: the
# drafter and the auditor must not share a failure mode. A plan drafted by fable
# and reviewed by fable agrees with itself — the same reading of an ambiguous
# issue produces the decomposition and then blesses it. Codex reads the same
# tree and the same plan with different training and an opposing brief, so a
# stage boundary that only looks right from one angle has somewhere to fail
# before it becomes twelve shards and an hour of implementation.
#
# It is a judging role in the Shape A sense: it reads, it prints one verdict,
# and it stops. It cannot edit the plan, and it has no route to plan.accepted
# that does not go through the routers below.
[[handlers]]
name = "audit-plan"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "plan.verified", "--publish-as", "plan.audited",
        "-e", "plan.audit-failed", "-t", "900000", "--",
        "signalbox", "agent", "audit"]
subscribes = ["plan.verified"]
publishes = ["plan.audited", "plan.audit-failed", "model.invoked"]

[[handlers]]
name = "route-plan-approved"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "plan.audited", "--publish-as", "plan.accepted", "--",
        "jq", "-c", 'select(.verdict == "approved")']
subscribes = ["plan.audited"]
publishes = ["plan.accepted"]

# The audit's own feedback edge, bounded on the same counter as the invariant
# loop. `attempt` is carried identity, so a redraft cannot reset it by saying so
# and the two loops cannot each spend three attempts.
[[handlers]]
name = "route-audit-changes"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "plan.audited", "--publish-as", "plan.rejected", "--",
        "jq", "-c", 'select(.verdict == "changes_requested" and .attempt < 3)']
subscribes = ["plan.audited"]
publishes = ["plan.rejected"]

[[handlers]]
name = "route-audit-exhausted"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "plan.audited", "--publish-as", "run.halted", "--",
        "jq", "-c", 'select(.verdict == "changes_requested" and .attempt >= 3) | . + {reason: "the plan audit never cleared its objections"}']
subscribes = ["plan.audited"]
publishes = ["run.halted"]

# Exhaustiveness. The auditor's output is untrusted input like any other model's,
# so a verdict outside the vocabulary becomes an event rather than a silent drop
# that would leave the run holding a verified plan nobody ever accepted.
[[handlers]]
name = "route-audit-invalid"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "plan.audited", "--publish-as", "plan.invalid-verdict", "--",
        "jq", "-c", 'select((.verdict // "") | IN("approved", "changes_requested") | not)']
subscribes = ["plan.audited"]
publishes = ["plan.invalid-verdict"]

# ─────────────────────────────────────────────────────────────────────────────
# STAGES paced sequentially / SHARDS split in parallel
# ─────────────────────────────────────────────────────────────────────────────

# Open the first stage directly from this run's accepted plan. The stage already
# carries its index, count, and full run identity. A global cursor here silently
# dropped a second run's plan.accepted while the first was in flight (#59).
[[handlers]]
name = "open-first-stage"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "plan.accepted", "--publish-as", "stage.opened", "--",
        "jq", "-c", ".stages[0] | select(.stage_index == 0)"]
subscribes = ["plan.accepted"]
publishes = ["stage.opened"]

# Both sides read the event-carried cursor. Re-deriving it from stage_id would
# replay the #59 crash: the last durable stage.merged must remain sufficient to
# advance or exhaust its own run after a restart. The cursor contains raw plan
# stages, so advance re-stamps the selected item with run identity and its new
# cursor rather than emitting that raw item as an orphan.
[[handlers]]
name = "guard-stages-advance"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "stage.merged", "--publish-as", "stage.opened", "--",
        "jq", "-c", '''. as $event
        | select(.stage_index != null and .stage_count != null)
        | (.stage_index + 1) as $index
        | select($index < .stage_count)
        | $event.stages[$index]
          + ($event | {run_id, repo, issue, title, base_sha, base_branch, attempt}
                    | with_entries(select(.value != null)))
          + {stage_index: $index, stage_count: $event.stage_count, stages: $event.stages}''']
subscribes = ["stage.merged"]
publishes = ["stage.opened"]

[[handlers]]
name = "guard-stages-exhaust"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "stage.merged", "--publish-as", "stages.exhausted", "--",
        "jq", "-c", "select(.stage_index != null and .stage_count != null) | select(.stage_index + 1 >= .stage_count)"]
subscribes = ["stage.merged"]
publishes = ["stages.exhausted"]

# The SDK splitter: N shard.opened events, causation intact, none held back.
# Also subscribes to stage.conflicted — FEEDBACK EDGE 3 reopens only the
# shards a merge conflict actually implicated.
[[handlers]]
name = "split-shards"
path = "signalbox"
args = ["primitive", "split-shards"]
subscribes = ["stage.opened", "stage.conflicted"]
publishes = ["shard.opened"]

# ─────────────────────────────────────────────────────────────────────────────
# IMPLEMENT — the agent re-enters through the control endpoint, announcing as
# it works. It writes code; it never decides what happens next.
# ─────────────────────────────────────────────────────────────────────────────

[[sinks]]
name = "dispatch-implement"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "shard.opened", "-t", "2400000", "--",
        "signalbox", "dispatch", "--skill", "signalbox-implement"]
subscribes = ["shard.opened"]
# Dispatch provenance is load-bearing because acting agents publish their own
# verdicts and otherwise leave no topology-visible model edge.
publishes = ["model.invoked"]

[[sinks]]
name = "dispatch-fix"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "fix.opened", "-t", "2400000", "--",
        "signalbox", "dispatch", "--skill", "signalbox-fix"]
subscribes = ["fix.opened"]
# A shard's fix rounds resume its recorded runner session; the review router
# increments and guards the round counter described in review-loop.md. CI
# findings deliberately arrive without shard_id and therefore cold-start a
# fixer session. See #90.
publishes = ["model.invoked"]

# The other half of the reaper's contract. A shard that announced is not silent,
# so its marker has to go; without this the reaper reported every successful
# shard as `shard.silent` once it aged past the threshold. A scope violation
# terminates the shard too, and terminates it without a submission.
# The wait for CI, made observable. Written when the PR opens and read back by
# `rehydrate` when a suite concludes; if no suite ever concludes, `reap-prs` finds
# this and publishes `checks.silent` instead of the run hanging with no event.
[[sinks]]
name = "mark-pr-pending"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "pr.opened", "-t", "10000", "--",
        "signalbox", "mark-pending", "--kind", "pr"]
subscribes = ["pr.opened"]

# Human approval waits are deliberately not reaped on the shard or PR clocks:
# the marker is durable storage for this run's projected identity until the
# operator grants that same run. PENDING_KEYS supplies run_id as the natural key.
[[sinks]]
name = "mark-approval-pending"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "approval.requested", "-t", "10000", "--",
        "signalbox", "mark-pending", "--kind", "approval"]
subscribes = ["approval.requested"]

[[sinks]]
name = "clear-approval-pending"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "approval.granted", "-t", "10000", "--",
        "signalbox", "clear-pending", "--kind", "approval"]
subscribes = ["approval.granted"]

[[sinks]]
name = "clear-pending"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "shard.submitted", "-s", "scope.violated", "-t", "10000", "--",
        "signalbox", "clear-pending", "--kind", "shard"]
subscribes = ["shard.submitted", "scope.violated"]

# Scope enforcement, at write time rather than review time. One predicate.
# This is what the previous implementation's scope subsystem collapses into.
[[handlers]]
name = "scope-guard"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.file-written", "--publish-as", "scope.violated", "--",
        "jq", "-c", 'select([.declared[] == .path] | any | not) | . + {outcome: "scope_violation"}']
subscribes = ["shard.file-written"]
publishes = ["scope.violated"]

[[handlers]]
name = "route-shard-done"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.submitted", "--publish-as", "shard.built", "--",
        "jq", "-c", 'select(.verdict == "done")']
subscribes = ["shard.submitted"]
publishes = ["shard.built"]

[[handlers]]
name = "route-shard-blocked"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.submitted", "--publish-as", "shard.abandoned", "--",
        "jq", "-c", 'select(.verdict == "blocked") | . + {outcome: "abandoned"}']
subscribes = ["shard.submitted"]
publishes = ["shard.abandoned"]

[[handlers]]
name = "route-shard-invalid"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.submitted", "--publish-as", "shard.invalid-verdict", "--",
        "jq", "-c", 'select((.verdict // "") | IN("done", "blocked") | not) | . + {outcome: "invalid"}']
subscribes = ["shard.submitted"]
publishes = ["shard.invalid-verdict"]

# ─────────────────────────────────────────────────────────────────────────────
# REVIEW — Shape A: one verdict type, then exclusive routers.
# ─────────────────────────────────────────────────────────────────────────────

[[handlers]]
name = "review-shard"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.built", "--publish-as", "review.submitted",
        "-e", "review.failed", "-t", "900000", "--",
        "signalbox", "agent", "review"]
subscribes = ["shard.built"]
# Review provenance is load-bearing audit evidence independent of its verdict.
publishes = ["review.submitted", "review.failed", "model.invoked"]

[[handlers]]
name = "route-approved"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "review.submitted", "--publish-as", "shard.approved", "--",
        "jq", "-c", 'select(.verdict == "approved") | . + {outcome: "approved"}']
subscribes = ["review.submitted"]
publishes = ["shard.approved"]

[[handlers]]
name = "route-changes"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "review.submitted", "--publish-as", "shard.changes-requested", "--",
        "jq", "-c", 'select(.verdict == "changes_requested")']
subscribes = ["review.submitted"]
publishes = ["shard.changes-requested"]

[[handlers]]
name = "route-review-invalid"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "review.submitted", "--publish-as", "review.invalid-verdict", "--",
        "jq", "-c", 'select((.verdict // "") | IN("approved", "changes_requested") | not)']
subscribes = ["review.submitted"]
publishes = ["review.invalid-verdict"]

# FEEDBACK EDGE 2. Fixes re-enter the IMPLEMENTATION vocabulary, so scope-guard
# and the reaper apply to them with no additional wiring.
[[handlers]]
name = "guard-rounds-continue"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.changes-requested", "--publish-as", "fix.opened", "--",
        "jq", "-c", "select(.round < 5) | .round += 1"]
subscribes = ["shard.changes-requested"]
publishes = ["fix.opened"]

[[handlers]]
name = "guard-rounds-exhaust"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.changes-requested", "--publish-as", "shard.escalated", "--",
        "jq", "-c", 'select(.round >= 5) | . + {outcome: "escalated"}']
subscribes = ["shard.changes-requested"]
publishes = ["shard.escalated"]

# ─────────────────────────────────────────────────────────────────────────────
# JOIN + MERGE — the join is stateful with a real timeout, because a lost shard
# result would matter here. It subscribes to every terminal shard outcome, so a
# stage cannot hang waiting on a shard that died.
#
# Keyed on run_id AND stage_id. A stage id is unique within its plan, not across
# them, and the plan skill's own example names stages `s1`/`s2` — so on stage_id
# alone two concurrent runs share one bucket, the join fires on whichever
# shard_count armed it first, and the resulting stage.closed mixes both runs'
# shards while the rest are dropped as late arrivals. Every rendezvous in this
# topology is run-scoped for that reason, and a test enforces it.
# ─────────────────────────────────────────────────────────────────────────────

[[handlers]]
name = "join-stage"
path = "signalbox"
args = ["primitive", "join-terminal", "--key", "run_id", "--key", "stage_id",
        "--count-field", "shard_count", "--timeout-seconds", "5400",
        "--publish-as", "stage.closed"]
subscribes = ["shard.approved", "shard.escalated", "shard.abandoned",
              "shard.invalid-verdict", "shard.silent", "scope.violated"]
publishes = ["stage.closed"]

[[handlers]]
name = "route-stage-clean"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "stage.closed", "--publish-as", "stage.mergeable", "--",
        "jq", "-c", 'select([.results[].outcome] | all(. == "approved"))']
subscribes = ["stage.closed"]
publishes = ["stage.mergeable"]

[[handlers]]
name = "route-stage-dirty"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "stage.closed", "--publish-as", "run.halted", "--",
        "jq", "-c", 'select([.results[].outcome] | all(. == "approved") | not) | . + {reason: "stage closed with unresolved shards"}']
subscribes = ["stage.closed"]
publishes = ["run.halted"]

[[handlers]]
name = "merge-stage"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "stage.mergeable", "--publish-as", "merge.attempted",
        "-t", "120000", "--", "signalbox", "merge-stage"]
subscribes = ["stage.mergeable"]
publishes = ["merge.attempted"]

[[handlers]]
name = "route-merge-ok"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "merge.attempted", "--publish-as", "stage.merged", "--",
        "jq", "-c", "select(.ok == true)"]
subscribes = ["merge.attempted"]
publishes = ["stage.merged"]

[[handlers]]
name = "route-merge-conflict"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "merge.attempted", "--publish-as", "stage.conflicted", "--",
        "jq", "-c", "select(.ok == false)"]
subscribes = ["merge.attempted"]
publishes = ["stage.conflicted"]

# The exhaustion event is identity-bearing, but this join remains the sole
# publisher of run.built. It carries identity because every stage.merged does.
[[handlers]]
name = "join-run"
path = "signalbox"
args = ["primitive", "join-terminal", "--key", "run_id",
        "--count-field", "stage_count", "--timeout-seconds", "10800",
        "--publish-as", "run.built", "--subscribe", "stage.merged"]
subscribes = ["stage.merged"]
publishes = ["run.built"]

# ─────────────────────────────────────────────────────────────────────────────
# GATE — suite.ran is a typed event with counts. The gate cannot be TOLD the
# suite passed; it can only observe the event or its absence.
# ─────────────────────────────────────────────────────────────────────────────

[[handlers]]
name = "run-suite"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "run.built", "--publish-as", "suite.ran",
        "-e", "suite.errored", "-t", "1800000", "--", "signalbox", "run-suite"]
subscribes = ["run.built"]
publishes = ["suite.ran", "suite.errored"]

[[handlers]]
name = "assess"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "suite.ran", "--publish-as", "gate.assessed",
        "-e", "assess.failed", "-t", "600000", "--",
        "signalbox", "agent", "assess"]
subscribes = ["suite.ran"]
# Promotion rests on this judgment, making its invocation provenance part of
# the gate's load-bearing evidence.
publishes = ["gate.assessed", "assess.failed", "model.invoked"]

[[handlers]]
name = "route-gate-auto"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "gate.assessed", "--publish-as", "gate.cleared", "--",
        "jq", "-c", 'select(.decision == "clear")']
subscribes = ["gate.assessed"]
publishes = ["gate.cleared"]

[[handlers]]
name = "route-gate-human"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "gate.assessed", "--publish-as", "approval.requested", "--",
        "jq", "-c", 'select(.decision == "needs_human")']
subscribes = ["gate.assessed"]
publishes = ["approval.requested"]

[[handlers]]
name = "route-gate-blocked"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "gate.assessed", "--publish-as", "gate.blocked", "--",
        "jq", "-c", 'select(.decision == "block")']
subscribes = ["gate.assessed"]
publishes = ["gate.blocked"]

[[handlers]]
name = "route-gate-invalid"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "gate.assessed", "--publish-as", "gate.invalid-verdict", "--",
        "jq", "-c", 'select((.decision // "") | IN("clear","needs_human","block") | not)']
subscribes = ["gate.assessed"]
publishes = ["gate.invalid-verdict"]

# ─────────────────────────────────────────────────────────────────────────────
# PROMOTE — four irreducible I/O acts, each independently retryable. A failed
# step publishes a failure event; none of them can stall silently.
# ─────────────────────────────────────────────────────────────────────────────

[[handlers]]
name = "push-branch"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "gate.cleared", "-s", "approval.granted",
        "--publish-as", "branch.pushed", "-e", "branch.push-failed",
        "-t", "120000", "--", "signalbox", "push-branch"]
subscribes = ["gate.cleared", "approval.granted"]
publishes = ["branch.pushed", "branch.push-failed"]

[[handlers]]
name = "open-pr"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "branch.pushed", "--publish-as", "pr.opened",
        "-e", "pr.open-failed", "-t", "60000", "--", "signalbox", "open-pr"]
subscribes = ["branch.pushed"]
publishes = ["pr.opened", "pr.open-failed"]

[[handlers]]
name = "route-checks-passed"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "checks.reported", "--publish-as", "checks.passed", "--",
        "jq", "-c", 'select(.conclusion == "success")']
subscribes = ["checks.reported"]
publishes = ["checks.passed"]

[[handlers]]
name = "route-checks-failed"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "checks.reported", "--publish-as", "checks.failed", "--",
        "jq", "-c", 'select(.conclusion == "failure")']
subscribes = ["checks.reported"]
publishes = ["checks.failed"]

# A check_suite payload carries one conclusion and no per-check detail, so the
# names of what broke have to be fetched. Its own act, on the failure path only:
# one irreducible I/O call, independently retryable, and never reached by a run
# whose checks passed.
[[handlers]]
name = "detail-failed-checks"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "checks.failed", "--publish-as", "checks.detailed",
        "-e", "checks.detail-failed", "-t", "60000", "--",
        "signalbox", "check-details"]
subscribes = ["checks.failed"]
publishes = ["checks.detailed", "checks.detail-failed"]

# FEEDBACK EDGE 4. Nobody wrote "handle CI failure". A red build becomes
# findings entering the review vocabulary, and the fix loop already exists.
#
# Subscribed to both the detailed event and the failure to detail it: a fix loop
# that cannot name the broken check is worse than one with no names, and losing
# the whole feedback edge to a failed `gh api` call would be worse still.
[[handlers]]
name = "map-ci-to-findings"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "checks.detailed", "-s", "checks.detail-failed",
        "--publish-as", "shard.changes-requested",
        "-t", "60000", "--", "signalbox", "map-ci-findings"]
subscribes = ["checks.detailed", "checks.detail-failed"]
publishes = ["shard.changes-requested"]

[[handlers]]
name = "merge-pr"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "checks.passed", "--publish-as", "pr.merged",
        "-e", "pr.merge-failed", "-t", "120000", "--", "signalbox", "merge-pr"]
subscribes = ["checks.passed"]
publishes = ["pr.merged", "pr.merge-failed"]

# ─────────────────────────────────────────────────────────────────────────────
# NOTES — one event per note. No shared document, no lock, nothing serialises.
# ─────────────────────────────────────────────────────────────────────────────

[[handlers]]
name = "plan-notes"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "checks.passed", "--publish-as", "notes.planned",
        "-e", "notes.plan-failed", "-t", "300000", "--",
        "signalbox", "agent", "plan-notes"]
subscribes = ["checks.passed"]
# Notes planning is still model judgment, so provenance is load-bearing even
# while the independently started merge arm is still in flight.
publishes = ["notes.planned", "notes.plan-failed", "model.invoked"]

# An empty notes plan has nothing for the fan-out or join to count, so the
# splitter short-circuits their silence by publishing the join's output topic
# directly and lets the run reach its terminal.
[[handlers]]
name = "split-notes"
path = "signalbox"
args = ["primitive", "split-notes"]
subscribes = ["notes.planned"]
publishes = ["note.drafted", "notes.synced"]

[[handlers]]
name = "write-note"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "note.drafted", "--publish-as", "note.written",
        "-e", "note.write-failed", "-t", "300000", "--",
        "signalbox", "agent", "write-note"]
subscribes = ["note.drafted"]
# A rewritten note is durable output, making the invocation that authored it
# load-bearing provenance rather than transient telemetry.
publishes = ["note.written", "note.write-failed", "model.invoked"]

[[handlers]]
name = "join-notes"
path = "signalbox"
args = ["primitive", "join-terminal", "--key", "run_id",
        "--count-field", "note_count", "--timeout-seconds", "900",
        "--publish-as", "notes.synced"]
subscribes = ["note.written", "note.write-failed"]
publishes = ["notes.synced"]

[[handlers]]
name = "join-completion"
path = "signalbox"
args = ["primitive", "join-terminal", "--key", "run_id",
        "--arms", "pr.merged,notes.synced", "--timeout-seconds", "1800",
        "--publish-as", "completion.closed"]
subscribes = ["pr.merged", "notes.synced"]
publishes = ["completion.closed"]

# Inherited from #66: notes.plan-failed has no run_id, so that failure cannot
# arrive at this run register's notes arm. The promote arm does at least create
# the run_id register and arm this join's timeout instead of leaving pure silence.
#
# Inherited from #66: a full rendezvous needs this edge so the neutral join
# result becomes success only after both arms have actually arrived.
[[handlers]]
name = "route-completion-full"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "completion.closed", "--publish-as", "run.completed", "--",
        "jq", "-c", 'select(.timed_out == true | not)']
subscribes = ["completion.closed"]
publishes = ["run.completed"]

# Inherited from #66: a timed-out rendezvous needs this edge so one missing arm
# becomes an explicit halt while preserving the arrival summary as evidence.
[[handlers]]
name = "route-completion-short"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "completion.closed", "--publish-as", "run.halted", "--",
        "jq", "-c", 'select(.timed_out == true) | . + {reason: "completion timed out — an arm never arrived"}']
subscribes = ["completion.closed"]
publishes = ["run.halted"]

# ─────────────────────────────────────────────────────────────────────────────
# RELEASE — a finished run gives its worktree back. Nothing did this before, so
# every run since the rewrite left its tree on disk forever.
# ─────────────────────────────────────────────────────────────────────────────

# `run.completed`, not `pr.merged`. Since #69 the notes arm starts at
# checks.passed and overlaps the merge, and dispatch runs every agent with cwd
# inside this worktree — releasing at the merge would delete the tree a
# write-note agent is still working in. The rendezvous is the first moment
# nothing is left inside it.
#
# A halted run is deliberately not subscribed. Its worktree is the evidence for
# why it halted, and disk is cheaper than that.
[[handlers]]
name = "release-workspace"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "run.completed", "--publish-as", "workspace.release-attempted",
        "-e", "workspace.release-failed", "-t", "60000", "--",
        "signalbox", "release-workspace"]
subscribes = ["run.completed"]
publishes = ["workspace.release-attempted", "workspace.release-failed"]

# `_out` prints the act's verdict and exits 0 regardless, so a refusal never
# reaches the -e topic (#66). Route on the value the way merge-stage already
# does, rather than letting a workspace that is still on disk announce itself
# as released.
[[handlers]]
name = "route-release-ok"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "workspace.release-attempted", "--publish-as", "workspace.released", "--",
        "jq", "-c", "select(.ok == true)"]
subscribes = ["workspace.release-attempted"]
publishes = ["workspace.released"]

[[handlers]]
name = "route-release-refused"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "workspace.release-attempted", "--publish-as", "workspace.release-failed", "--",
        "jq", "-c", "select(.ok == false)"]
subscribes = ["workspace.release-attempted"]
publishes = ["workspace.release-failed"]

# ─────────────────────────────────────────────────────────────────────────────
# EGRESS — genuine egress only, where seventy-six sinks used to do work.
# ─────────────────────────────────────────────────────────────────────────────

# sse-sink does NOT deliver on wildcard subscriptions — it accepts the client and
# streams nothing, which is a silent blindness rather than an error. Every topic is
# therefore listed explicitly, and a test asserts this list covers everything the
# topology publishes.
#
# The two exec topics are here for a different reason: they are the only traffic
# that flows while nothing is running. An idle sse-sink stream sends zero bytes,
# and a browser reports that as a server it cannot reach — so the dashboard reads
# as broken exactly when it should read as quiet.
#
# `exec.exit` is the load-bearing one. An interval source publishes `exec.output`
# only when its command actually wrote to stdout, and both reapers are silent by
# design when there is nothing to report — no stale shard, no stalled PR.
# `exec.exit` fires on every tick regardless, so it is what keeps the stream open.
# The page treats both as proof of life and renders neither.
# Invocation provenance is load-bearing dashboard traffic, and sse-sink's
# wildcard blindness means this explicit entry is the only observable path.
[[sinks]]
name = "dashboard"
path = "~/.local/share/emergent/primitives/bin/sse-sink"
args = ["--port", "8101"]
subscribes = ["exec.output", "exec.exit",
              "approval.granted", "approval.requested", "assess.failed", "branch.push-failed",
              "branch.pushed", "checks.detail-failed", "checks.detailed",
              "checks.failed", "checks.observed", "checks.passed", "checks.reported",
              "checks.silent", "checks.unknown-pr",
              "completion.closed", "control.unknown-event", "fix.opened", "gate.assessed",
              "gate.blocked", "gate.cleared", "gate.invalid-verdict", "issue.fetch-failed",
              "issue.fetched", "merge.attempted", "model.invoked", "note.drafted", "note.write-failed",
              "note.written", "notes.plan-failed", "notes.planned", "notes.synced",
              "plan.accepted", "plan.audit-failed", "plan.audited", "plan.checked",
              "plan.draft-failed", "plan.invalid-verdict", "plan.rejected",
              "plan.submitted", "plan.verified", "pr.merge-failed", "pr.merged", "pr.open-failed", "pr.opened",
              "review.failed", "review.invalid-verdict", "review.submitted", "run.built",
              "run.completed", "run.halted", "run.requested", "scope.violated",
              "shard.abandoned", "shard.approved", "shard.built", "shard.changes-requested",
              "shard.check-ran", "shard.escalated", "shard.file-written",
              "shard.invalid-verdict", "shard.opened", "shard.silent", "shard.submitted",
              "stage.closed", "stage.conflicted", "stage.mergeable", "stage.merged",
              "stage.opened", "stages.exhausted", "suite.errored", "suite.ran",
              "workspace.failed", "workspace.ready", "workspace.release-attempted",
              "workspace.release-failed", "workspace.released"]

# Lifecycle belongs here rather than on the dashboard: topology-viewer resolves
# its own subscriptions internally, which is why wildcards work for it and not
# for sse-sink.
[[sinks]]
name = "topology"
path = "~/.local/share/emergent/primitives/bin/topology-viewer"
args = ["--port", "8102"]
subscribes = ["system.started.*", "system.stopped.*", "system.error.*"]

# `checks.silent` is here because a run that reached `pr.opened` and never heard
# back is finished making progress on its own. It is the terminal event for the
# stall that used to be nothing at all.
[[sinks]]
name = "notify"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "approval.requested", "-s", "shard.escalated", "-s", "run.halted",
        "-s", "scope.violated", "-s", "gate.blocked", "-s", "checks.silent",
        "-t", "30000", "--", "signalbox", "notify"]
subscribes = ["approval.requested", "shard.escalated", "run.halted",
              "scope.violated", "gate.blocked", "checks.silent"]

[[sinks]]
name = "trace"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "run.completed", "-s", "run.halted", "-s", "control.unknown-event",
        "-s", "review.invalid-verdict", "-s", "shard.invalid-verdict",
        "-s", "gate.invalid-verdict", "-s", "checks.unknown-pr",
        "-s", "checks.silent", "--", "jq", "-c", "."]
subscribes = ["run.completed", "run.halted", "control.unknown-event",
              "review.invalid-verdict", "shard.invalid-verdict",
              "gate.invalid-verdict", "checks.unknown-pr", "checks.silent"]
