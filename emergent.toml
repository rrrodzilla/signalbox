# TRIP code-review loop as an Emergent topology.
#
# Cycle:  review.requested -> reviewer (codex) -> review.raw
#         review.raw -> verdict parsers -> review.approved | review.changes_requested
#         review.changes_requested -> round guard -> fix.requested | review.escalated
#         fix.requested -> fixer (claude -p) -> review.requested   <- the loop edge
#
# TRIP sentinels become topics; the round guard bounds the cycle at 3 fix
# attempts (rounds 1-4); approval writes results/CR.md under PROMOTION_READY.

# Engine names are namespaced per repo at install time and per run at launch.
# With socket_path = "auto", two concurrent runs of the same repo get distinct
# sockets; the name is also the event-store log directory, so their audit
# trails stay separate.
[engine]
name = "signalbox-review-loop__SIGNALBOX_RUN_SUFFIX__"
socket_path = "auto"

# ── Entry: one-shot seed emits the first review request ─────────────────────

[[sources]]
name = "seed"
path = "~/.local/share/emergent/primitives/bin/exec-source"
args = ["--shell", "bash", "--command", "__SIGNALBOX_ROOT__/bin/seed.sh"]
publishes = ["exec.output"]

[[handlers]]
name = "unwrap-seed"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "exec.output", "--publish-as", "review.requested", "--", "jq", "-c", ".stdout | fromjson | . + {correlation_id: (.feature + \"-\" + (now | strftime(\"%Y%m%d-%H%M%S\")))}"]
subscribes = ["exec.output"]
publishes = ["review.requested"]

# ── Reviewer: fresh Codex review per round, read-only sandbox ────────────────

[[handlers]]
name = "reviewer"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "review.requested", "--publish-as", "review.raw", "-t", "1800000", "--", "__SIGNALBOX_ROOT__/bin/review.sh"]
subscribes = ["review.requested"]
publishes = ["review.raw"]
env = { CODEX_MODEL = "gpt-5.6-sol", CODEX_EFFORT = "high" }

# ── Verdict parsing: sentinel string -> topic (jq silent-filter split) ───────

[[handlers]]
name = "verdict-approved"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "review.raw", "--publish-as", "review.approved", "--", "jq", "-c", "select(.verdict == \"APPROVED\")"]
subscribes = ["review.raw"]
publishes = ["review.approved"]

[[handlers]]
name = "verdict-changes"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "review.raw", "--publish-as", "review.changes_requested", "--", "jq", "-c", "select(.verdict == \"REQUEST_CHANGES\")"]
subscribes = ["review.raw"]
publishes = ["review.changes_requested"]

# ── Round guard: bound the cycle; round >= 4 escalates to a human ────────────

[[handlers]]
name = "round-guard"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "review.changes_requested", "--publish-as", "fix.requested", "--", "jq", "-c", "select(.round < 4)"]
subscribes = ["review.changes_requested"]
publishes = ["fix.requested"]

[[handlers]]
name = "escalation-guard"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "review.changes_requested", "--publish-as", "review.escalated", "--", "jq", "-c", "select(.round >= 4)"]
subscribes = ["review.changes_requested"]
publishes = ["review.escalated"]

# ── Fixer: headless Claude addresses feedback, closes the loop ───────────────

[[handlers]]
name = "fixer"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "fix.requested", "--publish-as", "review.requested", "-t", "1800000", "--", "__SIGNALBOX_ROOT__/bin/fix.sh"]
subscribes = ["fix.requested"]
publishes = ["review.requested"]

# ── Situational gate: the LLM sets the floor for the action at hand ──────────
# No policy table. The assessor (an LLM) is handed the action's mechanics and
# the live context and determines the readiness floor for THIS instance, with
# its rationale in the payload — so the event trail records not just what was
# decided but why. The gate itself is then a pure comparison: earned
# per-action readiness vs the assessed floor.

[[handlers]]
name = "assessor"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "review.approved", "--publish-as", "gate.assessed", "-t", "120000", "--", "__SIGNALBOX_ROOT__/bin/assess.sh"]
subscribes = ["review.approved"]
publishes = ["gate.assessed"]

[[handlers]]
name = "gate"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "gate.assessed", "--publish-as", "gate.decided", "--", "jq", "-c", ". + {decision: (if .readiness >= .floor then \"auto\" else \"human\" end)}"]
subscribes = ["gate.assessed"]
publishes = ["gate.decided"]

[[handlers]]
name = "route-auto"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "gate.decided", "--publish-as", "approval.granted", "--", "jq", "-c", "select(.decision == \"auto\")"]
subscribes = ["gate.decided"]
publishes = ["approval.granted"]

[[handlers]]
name = "route-human"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "gate.decided", "--publish-as", "approval.requested", "--", "jq", "-c", "select(.decision == \"human\")"]
subscribes = ["gate.decided"]
publishes = ["approval.requested"]

# Leader-directed return path: the human's webhook POST re-enters the fabric
# as approval.granted. No handler shortcuts this — the gate is topological.

[[sources]]
name = "approval-webhook"
path = "~/.local/share/emergent/primitives/bin/http-source"
args = ["--port", "__SIGNALBOX_PORT_APPROVAL__", "--path", "/approve"]
publishes = ["http.request"]

[[handlers]]
name = "unwrap-approval"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "http.request", "--publish-as", "approval.granted", "--", "jq", "-c", ".body"]
subscribes = ["http.request"]
publishes = ["approval.granted"]

# ── Vault sync: overlap work without weakening the promotion gate ───────────
# The syncer and CR-writing promoter are independent consumers of
# approval.granted, so vault sync overlaps the operator's review seam and the
# promotion phase's precondition work instead of blocking them. The guarantee
# that no PR can exist without a recorded docs-sync is not abandoned; it moves
# downstream to bin/promote-exec.sh, which blocks on a fresh, status: "OK",
# correlation-matched state/docs-sync.json before it will push or open a PR (see
# bin/docs-sync-wait.sh). bin/phase-run.sh hands its engine to a deferred reaper
# at the review terminal, so this handler is not killed mid-sync when the CR
# artifact lands first.

[[handlers]]
name = "docs-syncer"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "approval.granted", "--publish-as", "docs.synced", "-t", "900000", "--", "__SIGNALBOX_ROOT__/bin/docs-sync.sh"]
subscribes = ["approval.granted"]
publishes = ["docs.synced"]

# ── Readiness ladder: autonomy is earned, not granted ────────────────────────

[[sinks]]
name = "readiness-up"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "approval.granted", "--", "__SIGNALBOX_ROOT__/bin/readiness.sh", "up"]
subscribes = ["approval.granted"]

[[sinks]]
name = "readiness-down"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "review.escalated", "--", "__SIGNALBOX_ROOT__/bin/readiness.sh", "down"]
subscribes = ["review.escalated"]

# ── Sinks: narration, approval request, promotion, escalation, errors ────────

[[sinks]]
name = "narrator"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "review.raw", "--", "jq", "-r", "\"[round \\(.round)] verdict: \\(.verdict)\""]
subscribes = ["review.raw"]

[[sinks]]
name = "gate-narrator"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "gate.decided", "--", "jq", "-r", "\"[gate] \\(.action): floor R\\(.floor) vs readiness R\\(.readiness) -> \\(.decision) (\\(.rationale))\""]
subscribes = ["gate.decided"]

[[sinks]]
name = "approval-notify"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "approval.requested", "--", "__SIGNALBOX_ROOT__/bin/notify.sh"]
subscribes = ["approval.requested"]

[[sinks]]
name = "promoter"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "approval.granted", "--", "__SIGNALBOX_ROOT__/bin/promote.sh"]
subscribes = ["approval.granted"]

[[sinks]]
name = "escalation"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "review.escalated", "--", "__SIGNALBOX_ROOT__/bin/escalate-mark.sh", "review"]
subscribes = ["review.escalated"]

[[sinks]]
name = "errors"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "exec.error", "--", "jq", "-c", "."]
subscribes = ["exec.error"]

# Forward events to the one shared machine-level sink service on its fixed
# known port (default 8099, SIGNALBOX_SINK_PORT); this topology allocates and
# serves no port. Forwarding is fire-and-forget, so a down sink service cannot
# stall or fail a run. exec-sink gives its child only the payload, with no topic
# metadata, so one block per topic passes the exact label as a literal argument.
# The wildcard lifecycle blocks have no single literal to pass, so they rebuild
# the concrete topic from the payload's own "name" field before forwarding.
[[sinks]]
name = "forward-review-requested"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "review.requested", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "review", "review.requested"]
subscribes = ["review.requested"]

[[sinks]]
name = "forward-review-raw"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "review.raw", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "review", "review.raw"]
subscribes = ["review.raw"]

[[sinks]]
name = "forward-fix-requested"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "fix.requested", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "review", "fix.requested"]
subscribes = ["fix.requested"]

[[sinks]]
name = "forward-review-approved"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "review.approved", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "review", "review.approved"]
subscribes = ["review.approved"]

[[sinks]]
name = "forward-review-escalated"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "review.escalated", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "review", "review.escalated"]
subscribes = ["review.escalated"]

[[sinks]]
name = "forward-gate-assessed"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "gate.assessed", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "review", "gate.assessed"]
subscribes = ["gate.assessed"]

[[sinks]]
name = "forward-gate-decided"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "gate.decided", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "review", "gate.decided"]
subscribes = ["gate.decided"]

[[sinks]]
name = "forward-approval-requested"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "approval.requested", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "review", "approval.requested"]
subscribes = ["approval.requested"]

[[sinks]]
name = "forward-approval-granted"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "approval.granted", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "review", "approval.granted"]
subscribes = ["approval.granted"]

[[sinks]]
name = "forward-docs-synced"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "docs.synced", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "review", "docs.synced"]
subscribes = ["docs.synced"]

[[sinks]]
name = "forward-exec-error"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "exec.error", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "review", "exec.error"]
subscribes = ["exec.error"]

[[sinks]]
name = "forward-system-started-any"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "system.started.*", "-t", "5000", "--", "bash", "-c", 'payload=$(cat); name=$(jq -r ".name // empty" <<<"$payload" 2>/dev/null); printf "%s" "$payload" | "$0" review "system.started.${name:-unknown}"', "__SIGNALBOX_ROOT__/bin/sse-forward.sh"]
subscribes = ["system.started.*"]

[[sinks]]
name = "forward-system-stopped-any"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "system.stopped.*", "-t", "5000", "--", "bash", "-c", 'payload=$(cat); name=$(jq -r ".name // empty" <<<"$payload" 2>/dev/null); printf "%s" "$payload" | "$0" review "system.stopped.${name:-unknown}"', "__SIGNALBOX_ROOT__/bin/sse-forward.sh"]
subscribes = ["system.stopped.*"]

[[sinks]]
name = "forward-system-error-any"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "system.error.*", "-t", "5000", "--", "bash", "-c", 'payload=$(cat); name=$(jq -r ".name // empty" <<<"$payload" 2>/dev/null); printf "%s" "$payload" | "$0" review "system.error.${name:-unknown}"', "__SIGNALBOX_ROOT__/bin/sse-forward.sh"]
subscribes = ["system.error.*"]
