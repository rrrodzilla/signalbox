# TRIP batched-implement phase as an Emergent topology, with plan-declared
# concurrency sharding.
#
# stream-runner serializes STAGES (the plan's sequential dependencies — the
# next stage is held until the previous one acks). SHARDS within a stage fan
# out by subscription: every worker receives the stage event and takes the
# slice where shard_index % worker_count == its index, each shard in its own
# git worktree branched from the integration tip. The collector is the
# fan-in barrier; the merger rebases + ff-merges shard branches back into
# the integration branch and acks the next stage. A single-shard stage is
# the same code path — sequential is just the degenerate case of concurrent.

# Engine names are namespaced per repo at install time and per run at launch.
# With socket_path = "auto", two concurrent runs of the same repo get distinct
# sockets; the name is also the event-store log directory, so their audit
# trails stay separate.
[engine]
name = "signalbox-implement-stream__SIGNALBOX_RUN_SUFFIX__"
socket_path = "auto"

# ── Entry: seed resets prior runs, creates the integration worktree ──────────

[[sources]]
name = "plan-seed"
path = "~/.local/share/emergent/primitives/bin/exec-source"
args = ["--correlate", "--shell", "bash", "--command", "__SIGNALBOX_ROOT__/bin/plan-seed.sh"]
publishes = ["exec.output"]

[[handlers]]
name = "unwrap-plan"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "exec.output", "--publish-as", "plan.load", "--", "jq", "-c", ".stdout | fromjson"]
subscribes = ["exec.output"]
publishes = ["plan.load"]

# ── Stage sequencing: ack-gated stream of plan stages ────────────────────────

[[handlers]]
name = "stage-stream"
path = "~/.local/share/emergent/primitives/bin/stream-runner"
args = ["--load-topic", "plan.load", "--publish-as", "stage.item", "--ack-topic", "stage.ack", "--end-topic", "plan.done", "--items-key", "stages"]
subscribes = ["plan.load", "stage.ack"]
publishes = ["stage.item", "plan.done"]

# ── Fan-out: static worker pool, shards split by index ───────────────────────

[[handlers]]
name = "worker-0"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "stage.item", "--publish-as", "shard.built", "-t", "1800000", "--", "__SIGNALBOX_ROOT__/bin/shard-worker.sh", "0", "2"]
subscribes = ["stage.item"]
publishes = ["shard.built"]
env = { CODEX_MODEL = "gpt-5.6-sol", CODEX_EFFORT = "high" }

[[handlers]]
name = "worker-1"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "stage.item", "--publish-as", "shard.built", "-t", "1800000", "--", "__SIGNALBOX_ROOT__/bin/shard-worker.sh", "1", "2"]
subscribes = ["stage.item"]
publishes = ["shard.built"]
env = { CODEX_MODEL = "gpt-5.6-sol", CODEX_EFFORT = "high" }

# ── Per-shard delta review: gate every shard before it may reach the merge ───
# shard.built carries a pending queue per worker slice. slice-next pops one
# shard into the review loop; the approved splitter loops the payload back to
# shard.built with the shard moved to done/branches; slice-done drains the
# empty queue into shard.done — so the collector only ever sees APPROVED
# shards. Reviewer/fixer are worker-tagged, so two shards review concurrently.

[[handlers]]
name = "slice-next"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.built", "--publish-as", "shard.review.requested", "--", "jq", "-c", "select((.pending | length) > 0) | . + {current: .pending[0], pending: .pending[1:], round: 1, thread_id: \"\", feedback: \"\"}"]
subscribes = ["shard.built"]
publishes = ["shard.review.requested"]

[[handlers]]
name = "slice-done"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.built", "--publish-as", "shard.done", "--", "jq", "-c", "select((.pending | length) == 0) | {stage: .stage, expected: .expected, done: .done, branches: .branches}"]
subscribes = ["shard.built"]
publishes = ["shard.done"]

[[handlers]]
name = "reviewer-0"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.review.requested", "--publish-as", "shard.review.raw", "-t", "1800000", "--", "__SIGNALBOX_ROOT__/bin/shard-review.sh", "0"]
subscribes = ["shard.review.requested"]
publishes = ["shard.review.raw"]
env = { CODEX_MODEL = "gpt-5.6-sol", CODEX_EFFORT = "high" }

[[handlers]]
name = "reviewer-1"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.review.requested", "--publish-as", "shard.review.raw", "-t", "1800000", "--", "__SIGNALBOX_ROOT__/bin/shard-review.sh", "1"]
subscribes = ["shard.review.requested"]
publishes = ["shard.review.raw"]
env = { CODEX_MODEL = "gpt-5.6-sol", CODEX_EFFORT = "high" }

[[handlers]]
name = "shard-approved"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.review.raw", "--publish-as", "shard.built", "--", "jq", "-c", "select(.verdict == \"APPROVED\") | {stage: .stage, expected: .expected, worker: .worker, pending: .pending, done: (.done + [.current.shard]), branches: (.branches + [.current.branch])}"]
subscribes = ["shard.review.raw"]
publishes = ["shard.built"]

[[handlers]]
name = "shard-round-guard"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.review.raw", "--publish-as", "shard.fix.requested", "--", "jq", "-c", "select(.verdict == \"REQUEST_CHANGES\" and .round < 3)"]
subscribes = ["shard.review.raw"]
publishes = ["shard.fix.requested"]

[[handlers]]
name = "shard-escalation-guard"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.review.raw", "--publish-as", "shard.escalated", "--", "jq", "-c", "select(.verdict == \"REQUEST_CHANGES\" and .round >= 3)"]
subscribes = ["shard.review.raw"]
publishes = ["shard.escalated"]

[[handlers]]
name = "fixer-0"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.fix.requested", "--publish-as", "shard.review.requested", "-t", "1800000", "--", "__SIGNALBOX_ROOT__/bin/shard-fix.sh", "0"]
subscribes = ["shard.fix.requested"]
publishes = ["shard.review.requested"]

[[handlers]]
name = "fixer-1"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.fix.requested", "--publish-as", "shard.review.requested", "-t", "1800000", "--", "__SIGNALBOX_ROOT__/bin/shard-fix.sh", "1"]
subscribes = ["shard.fix.requested"]
publishes = ["shard.review.requested"]

# ── Fan-in: barrier, then rebase + ff-merge, then release next stage ─────────

[[handlers]]
name = "collector"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "shard.done", "--publish-as", "stage.done", "--", "__SIGNALBOX_ROOT__/bin/stage-collect.sh"]
subscribes = ["shard.done"]
publishes = ["stage.done"]

[[handlers]]
name = "merger"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "stage.done", "--publish-as", "stage.ack", "-t", "300000", "--", "__SIGNALBOX_ROOT__/bin/stage-merge.sh"]
subscribes = ["stage.done"]
publishes = ["stage.ack"]

# ── Sinks: narration and the final testing gate ──────────────────────────────

[[sinks]]
name = "stage-narrator"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "stage.item", "--", "jq", "-r", "\"[stage \\(.id)] dispatched: \\(.shards | length) shard(s)\""]
subscribes = ["stage.item"]

[[sinks]]
name = "review-narrator"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "shard.review.raw", "--", "jq", "-r", "\"[shard \\(.current.branch)] review round \\(.round): \\(.verdict)\""]
subscribes = ["shard.review.raw"]

[[sinks]]
name = "escalations"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "shard.escalated", "--", "__SIGNALBOX_ROOT__/bin/escalate-mark.sh", "shard"]
subscribes = ["shard.escalated"]

[[sinks]]
name = "merge-narrator"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "stage.ack", "--", "jq", "-r", "\"[stage \\(.stage)] merged \\(.merged | length) branch(es) -> integration @ \\(.tip)\""]
subscribes = ["stage.ack"]

[[sinks]]
name = "finisher"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "plan.done", "-t", "600000", "--", "__SIGNALBOX_ROOT__/bin/finish.sh"]
subscribes = ["plan.done"]

[[sinks]]
name = "errors"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "exec.error", "--", "jq", "-c", "."]
subscribes = ["exec.error"]

# Forward events to the one shared machine-level sink service on its fixed
# known port (default 8099, SIGNALBOX_SINK_PORT); this topology allocates and
# serves no port. Forwarding is fire-and-forget, so a down sink service cannot
# stall or fail a run. exec-sink gives its child only the payload, with no topic
# metadata, so one block per topic passes the exact label as a literal argument.
# The wildcard lifecycle blocks have no single literal to pass, so they rebuild
# the concrete topic from the payload's own "name" field before forwarding.
[[sinks]]
name = "forward-stage-item"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "stage.item", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "implement", "stage.item"]
subscribes = ["stage.item"]

[[sinks]]
name = "forward-shard-built"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "shard.built", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "implement", "shard.built"]
subscribes = ["shard.built"]

[[sinks]]
name = "forward-shard-review-raw"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "shard.review.raw", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "implement", "shard.review.raw"]
subscribes = ["shard.review.raw"]

[[sinks]]
name = "forward-shard-fix-requested"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "shard.fix.requested", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "implement", "shard.fix.requested"]
subscribes = ["shard.fix.requested"]

[[sinks]]
name = "forward-shard-done"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "shard.done", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "implement", "shard.done"]
subscribes = ["shard.done"]

[[sinks]]
name = "forward-stage-done"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "stage.done", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "implement", "stage.done"]
subscribes = ["stage.done"]

[[sinks]]
name = "forward-stage-ack"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "stage.ack", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "implement", "stage.ack"]
subscribes = ["stage.ack"]

[[sinks]]
name = "forward-shard-escalated"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "shard.escalated", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "implement", "shard.escalated"]
subscribes = ["shard.escalated"]

[[sinks]]
name = "forward-plan-done"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "plan.done", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "implement", "plan.done"]
subscribes = ["plan.done"]

[[sinks]]
name = "forward-exec-error"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "exec.error", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "implement", "exec.error"]
subscribes = ["exec.error"]

[[sinks]]
name = "forward-system-started-any"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "system.started.*", "-t", "5000", "--", "bash", "-c", 'payload=$(cat); name=$(jq -r ".name // empty" <<<"$payload" 2>/dev/null); printf "%s" "$payload" | "$0" implement "system.started.${name:-unknown}"', "__SIGNALBOX_ROOT__/bin/sse-forward.sh"]
subscribes = ["system.started.*"]

[[sinks]]
name = "forward-system-stopped-any"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "system.stopped.*", "-t", "5000", "--", "bash", "-c", 'payload=$(cat); name=$(jq -r ".name // empty" <<<"$payload" 2>/dev/null); printf "%s" "$payload" | "$0" implement "system.stopped.${name:-unknown}"', "__SIGNALBOX_ROOT__/bin/sse-forward.sh"]
subscribes = ["system.stopped.*"]

[[sinks]]
name = "forward-system-error-any"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "system.error.*", "-t", "5000", "--", "bash", "-c", 'payload=$(cat); name=$(jq -r ".name // empty" <<<"$payload" 2>/dev/null); printf "%s" "$payload" | "$0" implement "system.error.${name:-unknown}"', "__SIGNALBOX_ROOT__/bin/sse-forward.sh"]
subscribes = ["system.error.*"]
