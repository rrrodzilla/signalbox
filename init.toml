# TRIP-init's research phase as an Emergent topology: fan out one researcher
# per vault document, write the results into the Obsidian vault that
# .claude/docs points at. Non-destructive: existing docs (which TRIP-init
# gates on human approval) get a .proposed.md sibling instead.
#
#   init-seed ─> init.requested ── fan-out by subscription ──> researcher-architecture ┐
#                                 ├─────────────────────────> researcher-rules         ├─> doc.researched
#                                 └─────────────────────────> researcher-testing       ┘
#   doc.researched ─> vault-writer ─> doc.written ─> narrator

# Engine names are namespaced per repo at install time and per run at launch.
# With socket_path = "auto", two concurrent runs of the same repo get distinct
# sockets; the name is also the event-store log directory, so their audit
# trails stay separate.
[engine]
name = "signalbox-init__SIGNALBOX_RUN_SUFFIX__"
socket_path = "auto"

[[sources]]
name = "init-seed"
path = "~/.local/share/emergent/primitives/bin/exec-source"
args = ["--correlate", "--shell", "bash", "--command", "__SIGNALBOX_ROOT__/bin/init-seed.sh"]
publishes = ["exec.output"]

[[handlers]]
name = "unwrap-init"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "exec.output", "--publish-as", "init.requested", "--", "jq", "-c", ".stdout | fromjson"]
subscribes = ["exec.output"]
publishes = ["init.requested"]

[[handlers]]
name = "researcher-architecture"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "init.requested", "--publish-as", "doc.researched", "-t", "1800000", "--", "__SIGNALBOX_ROOT__/bin/research.sh", "architecture"]
subscribes = ["init.requested"]
publishes = ["doc.researched"]
env = { CODEX_MODEL = "gpt-5.6-sol", CODEX_EFFORT = "high" }

[[handlers]]
name = "researcher-rules"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "init.requested", "--publish-as", "doc.researched", "-t", "1800000", "--", "__SIGNALBOX_ROOT__/bin/research.sh", "rules"]
subscribes = ["init.requested"]
publishes = ["doc.researched"]
env = { CODEX_MODEL = "gpt-5.6-sol", CODEX_EFFORT = "high" }

[[handlers]]
name = "researcher-testing"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "init.requested", "--publish-as", "doc.researched", "-t", "1800000", "--", "__SIGNALBOX_ROOT__/bin/research.sh", "testing"]
subscribes = ["init.requested"]
publishes = ["doc.researched"]
env = { CODEX_MODEL = "gpt-5.6-sol", CODEX_EFFORT = "high" }

[[handlers]]
name = "vault-writer"
path = "~/.local/share/emergent/primitives/bin/exec-handler"
args = ["-s", "doc.researched", "--publish-as", "doc.written", "--", "__SIGNALBOX_ROOT__/bin/vault-write.sh"]
subscribes = ["doc.researched"]
publishes = ["doc.written"]

[[sinks]]
name = "init-narrator"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "doc.written", "--", "jq", "-r", "\"[init] \\(.doc) -> \\(.path) (\\(.bytes) bytes)\""]
subscribes = ["doc.written"]

[[sinks]]
name = "errors"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "exec.error", "--", "jq", "-c", "."]
subscribes = ["exec.error"]

# Forward events to the one shared machine-level sink service on its fixed
# known port (default 8099, SIGNALBOX_SINK_PORT); this topology allocates and
# serves no port. Forwarding is fire-and-forget, so a down sink service cannot
# stall or fail a run. exec-sink gives its child only the payload, with no topic
# metadata, so one block per topic passes the exact label as a literal argument.
# The wildcard lifecycle blocks have no single literal to pass, so they rebuild
# the concrete topic from the payload's own "name" field before forwarding.
[[sinks]]
name = "forward-init-requested"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "init.requested", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "init", "init.requested"]
subscribes = ["init.requested"]

[[sinks]]
name = "forward-doc-researched"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "doc.researched", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "init", "doc.researched"]
subscribes = ["doc.researched"]

[[sinks]]
name = "forward-doc-written"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "doc.written", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "init", "doc.written"]
subscribes = ["doc.written"]

[[sinks]]
name = "forward-exec-error"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "exec.error", "-t", "5000", "--", "__SIGNALBOX_ROOT__/bin/sse-forward.sh", "init", "exec.error"]
subscribes = ["exec.error"]

[[sinks]]
name = "forward-system-started-any"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "system.started.*", "-t", "5000", "--", "bash", "-c", 'payload=$(cat); name=$(jq -r ".name // empty" <<<"$payload" 2>/dev/null); printf "%s" "$payload" | "$0" init "system.started.${name:-unknown}"', "__SIGNALBOX_ROOT__/bin/sse-forward.sh"]
subscribes = ["system.started.*"]

[[sinks]]
name = "forward-system-stopped-any"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "system.stopped.*", "-t", "5000", "--", "bash", "-c", 'payload=$(cat); name=$(jq -r ".name // empty" <<<"$payload" 2>/dev/null); printf "%s" "$payload" | "$0" init "system.stopped.${name:-unknown}"', "__SIGNALBOX_ROOT__/bin/sse-forward.sh"]
subscribes = ["system.stopped.*"]

[[sinks]]
name = "forward-system-error-any"
path = "~/.local/share/emergent/primitives/bin/exec-sink"
args = ["-s", "system.error.*", "-t", "5000", "--", "bash", "-c", 'payload=$(cat); name=$(jq -r ".name // empty" <<<"$payload" 2>/dev/null); printf "%s" "$payload" | "$0" init "system.error.${name:-unknown}"', "__SIGNALBOX_ROOT__/bin/sse-forward.sh"]
subscribes = ["system.error.*"]
