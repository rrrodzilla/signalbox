[project]
name = "signalbox"
version = "0.1.0"
description = "Event-first automation of the plan/implement/review/promote loop on Emergent"
requires-python = ">=3.12"
dependencies = ["emergent-client>=0.13.1"]

[project.scripts]
signalbox = "signalbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalbox"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
