<!doctype html>
<meta charset="utf-8">
<title>Signalbox</title>
<style>
:root {
  --enamel:#10151d;      /* page ground: blue-black stove enamel */
  --casing:#171e28;      /* panel casing */
  --casing-2:#1d2632;    /* raised fittings */
  --seam:#2a3542;        /* casing seams */
  --paint:#d3dce4;       /* diagram paint: primary text, track lines */
  --dim:#7d8894;
  --faint:#4a5560;
  --green:#46c25a;       /* clear */
  --amber:#e6a23c;       /* occupied / caution */
  --red:#e15a5f;         /* danger */
  --white-lamp:#eef4fa;  /* route set */
  --violet:#a78bfa;      /* waiting on a human */
  --blue:#5aa7e8;

  /* The five meanings. Both views read these and nothing else, so a colour
     means the same thing in the register as it does on the card. */
  --go:var(--green);     /* a block or shard reached its finished state */
  --work:var(--amber);   /* normal progress inside a block */
  --judge:var(--blue);   /* a verdict or report landed, awaiting routing */
  --stop:var(--red);     /* a failure, violation, or rejection */
  --hold:var(--violet);  /* waiting on a human */
}
* { box-sizing:border-box; margin:0; }
html { scrollbar-color:var(--seam) var(--enamel); }
body { background:var(--enamel); color:var(--paint);
  font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
button { font:inherit; }
:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }

.plate { display:inline-block; text-transform:uppercase; letter-spacing:.22em;
  font-size:10px; font-weight:700; color:var(--dim);
  border:1px solid var(--seam); border-radius:2px; padding:3px 8px 2px 10px;
  background:linear-gradient(180deg, var(--casing-2), var(--casing)); }

header { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:14px 18px 12px; border-bottom:1px solid var(--seam);
  background:linear-gradient(180deg,#131924,var(--enamel)); position:sticky; top:0; z-index:5; }
.wordmark { font-size:15px; font-weight:700; letter-spacing:.34em;
  text-transform:uppercase; color:var(--white-lamp); padding-left:2px; }
.wordmark .box { color:var(--amber); }
#meta { color:var(--dim); font-size:11px; letter-spacing:.05em; display:flex;
  align-items:center; gap:8px; flex-wrap:wrap; }
#meta a { color:var(--dim); }
.lamp { display:inline-block; width:9px; height:9px; border-radius:50%;
  background:var(--faint); vertical-align:-1px; flex:none; }
.lamp.on-green { background:var(--green); box-shadow:0 0 6px 1px rgba(70,194,90,.55); }
.lamp.on-amber { background:var(--amber); box-shadow:0 0 6px 1px rgba(230,162,60,.55); }
.lamp.on-red { background:var(--red); box-shadow:0 0 6px 1px rgba(225,90,95,.55); }
.lamp.on-violet { background:var(--violet); box-shadow:0 0 6px 1px rgba(167,139,250,.55); }
.lamp.on-white { background:var(--white-lamp); box-shadow:0 0 6px 1px rgba(238,244,250,.45); }

.deck { display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:0; }
@media (max-width:1100px){ .deck { grid-template-columns:1fr; } }
.board { padding:16px 18px 40px; min-width:0; }
.board section { margin-bottom:22px; }
.section-head { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
.section-head .count { color:var(--faint); font-size:11px; }
.empty { color:var(--faint); font-size:12px; padding:14px 2px; }

.run { border:1px solid var(--seam); border-radius:4px; background:var(--casing);
  margin-bottom:12px; overflow:hidden; }
.run.selected { border-color:var(--dim); box-shadow:0 0 0 1px var(--dim); }
.run.attention { border-color:color-mix(in srgb, var(--red) 45%, var(--seam)); }
.run-head { display:flex; align-items:center; gap:10px; width:100%;
  background:none; border:0; color:inherit; text-align:left; cursor:pointer;
  padding:10px 12px 8px; }
.run-title { font-size:13px; font-weight:600; color:var(--white-lamp);
  min-width:0; overflow-wrap:anywhere; }
.run-title .repo { color:var(--dim); font-weight:400; }
.run-age { margin-left:auto; color:var(--faint); font-size:11px; white-space:nowrap; }
.livery { font-size:10px; text-transform:uppercase; letter-spacing:.14em;
  color:var(--dim); white-space:nowrap; }
.livery.running { color:var(--green); }
.livery.stopped { color:var(--faint); }
.livery.stale { color:var(--amber); }
.livery.halted { color:var(--red); }
.livery.parked { color:var(--violet); }

.track { display:grid; grid-template-columns:repeat(5,1fr); gap:0; padding:2px 12px 0; }
.block { position:relative; padding:14px 0 6px; }
.block::before { content:""; position:absolute; left:0; right:0; top:22px;
  height:2px; background:var(--faint); }
.block.done::before { background:var(--green); }
.block.active::before { background:var(--amber); }
.block.failed::before { background:var(--red); }
.block.parked::before { background:var(--violet); }
/* Entered, but nothing heard from it yet. A judging node publishes nothing until
   it finishes, so `docs` can sit between checks.passed and notes.planned looking
   exactly like a block the run had not reached. Hollow, not filled: the run is
   here, the block has not spoken. */
.block.waiting::before {
  background:repeating-linear-gradient(90deg,
    var(--amber) 0 4px, transparent 4px 9px); opacity:.5; }
.block:not(:first-child)::after { content:""; position:absolute; left:-1px;
  top:17px; width:2px; height:12px; background:var(--seam); }
.block .lamp { position:absolute; top:18px; left:50%; margin-left:-5px;
  width:10px; height:10px; border:1px solid var(--enamel); }
.block.active .lamp { animation:pulse 2.4s ease-in-out infinite; }
.block.waiting .lamp { background:transparent; box-shadow:inset 0 0 0 1.5px var(--amber);
  animation:pulse 2.4s ease-in-out infinite; opacity:.6; }
.block .bname { display:block; text-align:center; margin-top:18px;
  font-size:10px; text-transform:uppercase; letter-spacing:.16em; color:var(--faint); }
.block.done .bname { color:var(--dim); }
.block.active .bname { color:var(--amber); }
.block.waiting .bname { color:var(--amber); opacity:.65; }
.block .sub .await { color:var(--amber); opacity:.8; font-variant-numeric:tabular-nums; }
.block.failed .bname { color:var(--red); }
.block.parked .bname { color:var(--violet); }
@keyframes pulse { 50% { box-shadow:0 0 10px 3px rgba(230,162,60,.65); } }
@media (prefers-reduced-motion: reduce) { .block.active .lamp { animation:none; } }

.block .sub { display:block; text-align:center; margin-top:3px; font-size:9px;
  letter-spacing:.08em; color:var(--dim); text-transform:none; }
.block .sub .rounds { color:var(--blue); }
.block .sub .fixing { color:var(--amber); }
.sidings { display:flex; justify-content:center; align-items:center; gap:4px;
  margin-top:4px; flex-wrap:wrap; padding:0 4px; }
.sidings .bar { width:8px; height:2px; background:var(--seam); flex:none; }
.shard-lamp { width:8px; height:8px; border-radius:2px; flex:none;
  background:transparent; border:1px solid var(--faint); }
/* Same five meanings as everything else. A shard in a fix round is *working*
   (amber fill) but carries the rejection that sent it back (red ring); it used
   to be solid red, which made ordinary rework look like an escalation. */
.shard-lamp.s-building { background:var(--work); border-color:var(--work); }
.shard-lamp.s-review { background:var(--judge); border-color:var(--judge); }
.shard-lamp.s-fixing { background:var(--work); border-color:var(--stop); }
.shard-lamp.s-done { background:var(--go); border-color:var(--go); }
.shard-lamp.s-escalated { background:var(--stop); border-color:var(--stop);
  animation:pulse 2.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .shard-lamp.s-escalated { animation:none; } }

/* The tick line. Its whole job is to move for EVERY event, including the many
   that change no block state — the count always advances and the topic almost
   always does, so silence on the card now means silence on the wire. */
.tick { display:flex; align-items:baseline; gap:8px; padding:5px 12px 0;
  font-size:10px; letter-spacing:.06em; color:var(--faint); }
.tick .tdot { width:6px; height:6px; border-radius:50%; flex:none;
  background:var(--sev, var(--faint)); align-self:center; }
.tick .ttype { color:var(--sev, var(--dim)); overflow-wrap:anywhere; min-width:0; }
.tick .tcount { margin-left:auto; flex:none; }
@keyframes tick-in { from { opacity:.25; } to { opacity:1; } }
.tick.fresh .ttype { animation:tick-in .5s ease-out; }

/* The rail flashes in the meaning's colour, so the register row and the block
   that moved are the same colour at the same moment. */
@keyframes rail-flash {
  0%   { background:var(--sev); box-shadow:0 0 9px 2px var(--sev); }
  100% { box-shadow:0 0 0 0 transparent; }
}
.block.pulse::before { animation:rail-flash .9s ease-out; }
.block .bcount { position:absolute; top:0; right:2px; font-size:9px;
  color:var(--faint); letter-spacing:.04em; }
@media (prefers-reduced-motion: reduce) {
  .block.pulse::before { animation:none; }
  .tick.fresh .ttype { animation:none; }
}

.verdict { display:flex; gap:8px; align-items:baseline; padding:8px 12px 10px;
  font-size:12px; color:var(--dim); }
.verdict span { overflow-wrap:anywhere; min-width:0; }
.verdict b { font-weight:700; letter-spacing:.08em; flex:none; }
.verdict.v-green b { color:var(--green); } .verdict.v-red b { color:var(--red); }
.verdict.v-amber b { color:var(--amber); } .verdict.v-violet b { color:var(--violet); }

.drawer { border-top:1px solid var(--seam); }
.drawer > summary { list-style:none; cursor:pointer; padding:6px 12px;
  font-size:10px; text-transform:uppercase; letter-spacing:.18em; color:var(--faint); }
.drawer > summary::-webkit-details-marker { display:none; }
.drawer > summary::before { content:"+ "; }
.drawer[open] > summary::before { content:"\2212 "; }
.drawer-body { padding:2px 12px 12px; }
.idline { color:var(--faint); font-size:11px; overflow-wrap:anywhere; }
.idline b { color:var(--dim); font-weight:400; }

.register { border-left:1px solid var(--seam); background:#131924; min-width:0; }
@media (max-width:1100px){ .register { border-left:0; border-top:1px solid var(--seam); } }
.register-inner { position:sticky; top:57px; max-height:calc(100vh - 57px);
  display:flex; flex-direction:column; }
.register-head { padding:14px 14px 8px; }
.badges { display:flex; gap:6px; flex-wrap:wrap; padding:0 14px 10px; }
.badge { font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  border:1px solid var(--seam); border-radius:2px; padding:2px 7px;
  color:var(--dim); background:none; cursor:pointer; }
.badge.on { color:var(--white-lamp); border-color:var(--dim); }
/* The legend carries the colour it filters for, so the register's chips double
   as the key to the card. */
.badges .badge[class*="sev-"]::before { content:""; display:inline-block;
  width:6px; height:6px; border-radius:50%; margin-right:5px; vertical-align:0;
  background:var(--sev, var(--faint)); }
#feed { overflow-y:auto; padding:0 14px 24px; }
.ev { border-top:1px solid var(--seam); padding:6px 0; }
.ev .hd { color:var(--faint); font-size:10px; display:flex; gap:8px; }
.ev .hd .badge { margin-left:auto; cursor:default; }
.ev .ty { font-weight:700; }
.ev .bd { color:var(--dim); font-size:11px; overflow-wrap:anywhere; }
/* One palette, read by the register row, the card's tick line, and the rail
   flash. Adding a meaning here changes all three at once, on purpose. */
.sev-go    { --sev:var(--go); }
.sev-work  { --sev:var(--work); }
.sev-judge { --sev:var(--judge); }
.sev-stop  { --sev:var(--stop); }
.sev-hold  { --sev:var(--hold); }
.sev-unmapped { --sev:var(--white-lamp); }
.ev .ty { color:var(--sev, var(--dim)); }
.ev.sev-unmapped .ty::after { content:" ?"; color:var(--white-lamp); }
</style>

<header>
  <div class="wordmark">Signal<span class="box">box</span></div>
  <div id="meta">
    <span class="lamp" id="stream-lamp"></span><span id="meta-text">connecting…</span>
    <span>·</span><a href="http://localhost:8102" target="_blank">topology</a>
  </div>
</header>

<div class="deck">
  <main class="board" id="board" aria-label="runs"></main>
  <aside class="register" aria-label="event register">
    <div class="register-inner">
      <div class="register-head"><span class="plate">Register</span></div>
      <div class="badges" id="badges"></div>
      <div id="feed"><div class="empty" id="feed-empty">Waiting for events…</div></div>
    </div>
  </aside>
</div>

<script>
"use strict";

/* The five track sections a run passes through. Every event maps to one. */
const BLOCKS = ["plan", "build", "gate", "promote", "docs"];

/* The single source of truth for BOTH views: topic -> [block, meaning].
   The register colours a row by the meaning and the card colours the same
   event's block by the same meaning, so the two can never drift apart. They
   used to be computed separately — a block table here and four regexes there —
   which is how `shard.built` came to be green in the register while the card
   painted the same shard blue.

   The meanings, and the only five there are:
     go     a block or shard reached its finished state
     work   normal progress inside a block
     judge  a verdict or report landed and is awaiting routing
     stop   a failure, violation, or rejection
     hold   waiting on a human

   A topic absent from this table is a topology change the page has not been
   taught yet; `sev()` calls that out rather than quietly rendering it grey. */
const EVENT = {
  "run.requested":["plan","work"], "workspace.ready":["plan","work"],
  "workspace.failed":["plan","stop"], "issue.fetched":["plan","work"],
  "issue.fetch-failed":["plan","stop"], "codebase.surveyed":["plan","work"],
  "survey.failed":["plan","stop"], "plan.submitted":["plan","judge"],
  "plan.checked":["plan","judge"], "plan.accepted":["plan","go"],
  "plan.rejected":["plan","stop"], "plan.draft-failed":["plan","stop"],

  "stage.opened":["build","work"], "shard.opened":["build","work"],
  "shard.file-written":["build","work"], "shard.check-ran":["build","work"],
  "shard.submitted":["build","judge"], "shard.built":["build","judge"],
  "shard.abandoned":["build","stop"], "shard.invalid-verdict":["build","stop"],
  "shard.silent":["build","stop"], "scope.violated":["build","stop"],
  "review.submitted":["build","judge"], "review.failed":["build","stop"],
  "review.invalid-verdict":["build","stop"], "shard.approved":["build","go"],
  "shard.changes-requested":["build","stop"], "fix.opened":["build","work"],
  "shard.escalated":["build","stop"], "stage.closed":["build","work"],
  "stage.mergeable":["build","judge"], "merge.attempted":["build","judge"],
  "stage.merged":["build","go"], "stage.conflicted":["build","stop"],
  "stages.exhausted":["build","work"], "run.built":["build","go"],

  "suite.ran":["gate","judge"], "suite.errored":["gate","stop"],
  "gate.assessed":["gate","judge"], "assess.failed":["gate","stop"],
  "gate.cleared":["gate","go"], "gate.blocked":["gate","stop"],
  "gate.invalid-verdict":["gate","stop"], "approval.requested":["gate","hold"],
  "approval.granted":["gate","go"],

  "branch.pushed":["promote","work"], "branch.push-failed":["promote","stop"],
  "pr.opened":["promote","work"], "pr.open-failed":["promote","stop"],
  "checks.observed":["promote","judge"], "checks.reported":["promote","judge"],
  "checks.detailed":["promote","judge"], "checks.detail-failed":["promote","stop"],
  "checks.passed":["promote","go"], "checks.failed":["promote","stop"],
  "checks.silent":["promote","stop"], "checks.unknown-pr":["promote","stop"],
  "pr.merged":["promote","go"], "pr.merge-failed":["promote","stop"],

  "notes.planned":["docs","work"], "notes.plan-failed":["docs","stop"],
  "note.drafted":["docs","work"], "note.written":["docs","go"],
  "note.write-failed":["docs","stop"], "notes.synced":["docs","go"],

  /* Run-level: no single block owns them. The release topics land after every
     block has finished, so pinning them to one would move a card backwards. */
  "completion.closed":[null,"go"], // both arms accounted for — rendezvous closed
  "run.completed":[null,"go"], "run.halted":[null,"stop"],
  "control.unknown-event":[null,"stop"],
  "workspace.release-attempted":[null,"judge"], "workspace.released":[null,"go"],
  "workspace.release-failed":[null,"stop"],
};

const SEVERITIES = ["go", "work", "judge", "stop", "hold"];

function blockOf(type) { return (EVENT[type] || [])[0] || null; }

/* An unmapped topic is a real signal: the topology publishes something this
   page does not understand. Say so in the loudest colour rather than hiding it
   among the informational rows, which is where the old default sent it. */
function sev(type) { return (EVENT[type] || [])[1] || "unmapped"; }

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function age(now, then) {
  const s = Math.max(0, Math.round((now - then) / 1000));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  return Math.floor(s / 3600) + "h" + (Math.floor((s % 3600) / 60)) + "m";
}

/* Keeps its seconds, unlike age(). A wait counter is there to prove the page is
   still watching, and one that reads "2m" for sixty seconds cannot do that. */
function elapsed(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m" + String(s % 60).padStart(2, "0") + "s";
  return Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") + "m";
}

/* ── run model, derived entirely from the event stream ───────────────── */

const runs = new Map();
const feed = [];
const provenance = new Map();
let totalEvents = 0;
let filter = null;
const openDrawers = new Set();
let selected = null;

function runFor(id) {
  if (!runs.has(id)) {
    runs.set(id, {
      key: id, repo: "unknown", issue: null, title: null,
      blocks: Object.fromEntries(BLOCKS.map((b) => [b, "idle"])),
      counts: Object.fromEntries(BLOCKS.map((b) => [b, 0])),
      shards: new Map(), stages: new Map(), rounds: 0, attempt: 1,
      // block -> when the run entered it, for blocks that have not yet spoken.
      waiting: {},
      verdict: { label: "opening", cls: "", detail: "" },
      first: Date.now(), last: Date.now(), state: "running",
      worktree: null, base: null, notes: [], suite: null, pr: null,
      // Every event moves these three, which is what guarantees the card
      // reacts even when no block changes state.
      events: 0, tick: null, pulse: null,
    });
  }
  return runs.get(id);
}

function shardState(run, id) {
  if (!run.shards.has(id)) run.shards.set(id, "building");
  return run.shards.get(id);
}

const IDENTITY = ["run_id", "stage_id", "shard_id", "round", "role", "skill"];

function identity(p) {
  return Object.fromEntries(IDENTITY
    .filter((k) => p && p[k] !== undefined && p[k] !== null)
    .map((k) => [k, p[k]]));
}

function identityKey(id) {
  return IDENTITY.filter((k) => id[k] !== undefined)
    .map((k) => k + "=" + JSON.stringify(id[k])).join("|");
}

function invocationFor(entry) {
  let best = null;
  let bestScore = 0;
  for (const invocation of provenance.values()) {
    let score = 0;
    let conflict = false;
    for (const k of IDENTITY) {
      if (entry[k] === undefined || invocation[k] === undefined) continue;
      if (entry[k] !== invocation[k]) { conflict = true; break; }
      score++;
    }
    if (!conflict && score > bestScore) {
      best = invocation;
      bestScore = score;
    }
  }
  return best;
}

/* Provenance is not a domain event: it is excluded from the register, so letting
   it move the card would only invert the inconsistency. It is handled at the
   stream instead of inside apply(), which leaves apply() with no early return —
   that is what makes "every event moves the card" an enforceable rule rather
   than one with an exception a future topic could quietly join. */
function isProvenance(msg) {
  return msg.type === "model.invoked" || msg.payload?.event === "model.invoked";
}

function recordProvenance(p) {
  const id = identity(p);
  provenance.set(identityKey(id), { ...id, runner: p.runner, model: p.model });
}

/* Three topics arrive with no run_id, for three different reasons, and none of
   them is a run: `stages.exhausted` because stream-runner's end event is
   literally {"count": N} (emergent.toml says so where join-run works around it),
   the exec-handler `-e` error topics because a failure publishes {command,
   exit_code, stderr} instead of the inbound payload (#66), and reaper telemetry
   which never had identity. Bucketing them under a fake key built a card that
   looked like a run nobody launched. They stay in the register, where they are
   real events, and are counted here so their absence from the board is a stated
   number rather than a silent drop. */
let unattributed = 0;

function isAttributed(msg) {
  return Boolean(msg.payload && msg.payload.run_id);
}

function apply(msg) {
  const t = msg.type;
  const p = msg.payload || {};
  const run = runFor(p.run_id);
  run.last = msg.timestamp || Date.now();

  if (p.repo) run.repo = p.repo;
  else if (p.repo_path) run.repo = String(p.repo_path).split("/").filter(Boolean).pop();
  if (p.issue != null) run.issue = p.issue;
  if (p.title) run.title = p.title;
  if (p.worktree) run.worktree = p.worktree;
  if (p.base_sha) run.base = p.base_sha;
  if (p.attempt) run.attempt = p.attempt;

  const block = blockOf(t);
  const meaning = sev(t);

  // Unconditional, before any switch. Every event advances the counter, names
  // itself on the tick line, and flashes the rail it belongs to — so an event
  // that changes no state is still visibly an event, which is the whole point.
  run.events++;
  run.tick = { type: t, sev: meaning, at: run.last };
  if (block) {
    run.counts[block] = (run.counts[block] || 0) + 1;
    run.pulse = { block, sev: meaning, at: Date.now() };
  }

  // A block that speaks is working, whether it was idle or had been waiting.
  if (block && (run.blocks[block] === "idle" || run.blocks[block] === "waiting")) {
    run.blocks[block] = "active";
    delete run.waiting[block];
  }

  // Finishing a block enters the next one. Without this the run appeared to be
  // nowhere during every judging pause. Notes planning now overlaps the merge,
  // so checks.passed explicitly enters docs while both arms are in flight.
  const enterNext = (b) => {
    const next = BLOCKS[BLOCKS.indexOf(b) + 1];
    if (next && run.blocks[next] === "idle") {
      run.blocks[next] = "waiting";
      run.waiting[next] = Date.now();
    }
  };
  const set = (b, s) => {
    run.blocks[b] = s;
    if (s !== "waiting") delete run.waiting[b];
    if (s === "done") enterNext(b);
  };
  const before = (b) => BLOCKS.slice(0, BLOCKS.indexOf(b)).forEach((x) => {
    if (run.blocks[x] !== "failed") run.blocks[x] = "done";
  });

  // Milestones set the verdict too, not only failures. Without them the line
  // latches on the last bad news and keeps shouting it while the run recovers:
  // a card reading CHANGES REQUESTED while the register showed the same run
  // already at checks.reported.
  const milestone = (label) => {
    run.verdict = { label, cls: "v-green", detail: "" };
  };

  switch (t) {
    case "plan.accepted": set("plan", "done"); milestone("PLAN ACCEPTED"); break;
    case "plan.rejected": run.verdict = { label: "PLAN REJECTED", cls: "v-amber",
      detail: (p.violations || []).join("; ") }; break;
    case "workspace.failed": case "issue.fetch-failed": case "survey.failed":
    case "plan.draft-failed":
      set("plan", "failed");
      run.verdict = { label: "FAILED", cls: "v-red", detail: p.error || t }; break;
    case "shard.opened": run.shards.set(p.shard_id, "building");
      if (p.stage_id) run.stages.set(p.stage_id, p.shard_count || 0);
      before("build"); break;
    case "shard.submitted": case "shard.built":
      run.shards.set(p.shard_id, "review"); break;
    case "shard.approved": run.shards.set(p.shard_id, "done");
      milestone("SHARD APPROVED"); break;
    case "shard.changes-requested": run.shards.set(p.shard_id, "fixing");
      run.rounds = Math.max(run.rounds, p.round || 0);
      run.verdict = { label: "CHANGES REQUESTED", cls: "v-red",
        detail: p.shard_id ? p.shard_id + " round " + (p.round || 1) : "" }; break;
    case "fix.opened": run.shards.set(p.shard_id, "fixing");
      run.rounds = Math.max(run.rounds, p.round || 0); break;
    case "shard.escalated": case "shard.abandoned": case "scope.violated":
    case "shard.silent": case "shard.invalid-verdict":
      run.shards.set(p.shard_id, "escalated");
      run.verdict = { label: t.split(".")[1].toUpperCase().replace(/-/g, " "),
        cls: "v-red", detail: p.reason || p.path || "" }; break;
    case "stage.merged": run.merged = (run.merged || 0) + 1;
      run.shards.clear(); break;   // the next stage opens its own shards
    case "stage.conflicted": set("build", "failed");
      run.verdict = { label: "STAGE CONFLICTED", cls: "v-red",
        detail: p.stage_id || "" }; break;
    case "run.built": set("build", "done"); before("gate"); milestone("BUILT"); break;
    case "suite.ran": run.suite = p.ran
      ? (p.ok ? "suite passed" : "suite FAILED") : "no suite ran"; break;
    case "gate.cleared": set("gate", "done"); before("promote"); milestone("GATE CLEARED"); break;
    case "approval.requested": set("gate", "parked"); run.state = "parked";
      run.verdict = { label: "AWAITING APPROVAL", cls: "v-violet",
        detail: p.rationale || "" }; break;
    case "approval.granted": set("gate", "done"); run.state = "running";
      milestone("APPROVED"); break;
    case "gate.blocked": set("gate", "failed");
      run.verdict = { label: "BLOCKED", cls: "v-red",
        detail: (p.reasons || []).join("; ") || p.rationale || "" }; break;
    case "branch.push-failed": case "pr.open-failed": case "pr.merge-failed":
      set("promote", "failed");
      run.verdict = { label: "PROMOTE FAILED", cls: "v-red", detail: p.error || "" }; break;
    case "pr.opened": run.pr = p.pr || p.url; break;
    case "checks.passed": run.suite = "checks passed"; before("docs");
      milestone("CHECKS PASSED"); break;
    case "checks.failed": run.suite = "checks FAILED";
      run.verdict = { label: "CHECKS FAILED", cls: "v-red",
        detail: (p.failed || []).join(", ") }; break;
    case "checks.silent": case "checks.unknown-pr":
      set("promote", "failed");
      run.verdict = { label: t.split(".")[1].toUpperCase().replace(/-/g, " "),
        cls: "v-red", detail: p.reason || p.branch || "" }; break;
    case "pr.merged": set("promote", "done"); milestone("MERGED"); break;
    case "note.written": run.notes.push(p.note); break;
    case "notes.plan-failed": case "note.write-failed":
      set("docs", "failed");
      run.verdict = { label: "NOTES FAILED", cls: "v-red",
        detail: p.error || p.note || "" }; break;
    case "notes.synced": set("docs", "done"); milestone("NOTES SYNCED"); break;
    case "run.completed": BLOCKS.forEach((b) => { if (run.blocks[b] !== "failed") run.blocks[b] = "done"; });
      // A finished run waits for nothing; leaving a counter running would make a
      // completed card keep claiming it was still expecting something.
      run.waiting = {};
      run.state = "stopped";
      run.verdict = { label: "COMPLETE", cls: "v-green", detail: run.suite || "" }; break;
    case "run.halted": run.state = "halted";
      // A halt names no block, so nothing on the track used to turn red and the
      // card claimed HALTED above five rails that still read as progressing.
      // The block it died in is the first one not yet finished.
      set(BLOCKS.find((b) => run.blocks[b] !== "done") || BLOCKS[0], "failed");
      run.waiting = {};
      run.verdict = { label: "HALTED", cls: "v-red", detail: p.reason || "" }; break;
  }

  if (run.verdict.label === "opening" && block) {
    run.verdict = { label: t.toUpperCase(), cls: "v-amber", detail: "" };
  }
}

/* ── rendering ───────────────────────────────────────────────────────── */

function shardSidings(run) {
  const stages = run.merged
    ? '<span class="sub">' + run.merged + " stage" + (run.merged === 1 ? "" : "s") +
      " merged</span>"
    : "";
  // Shards are cleared when a stage merges, so between stages the only honest
  // thing to show is how many stages are behind us.
  if (!run.shards.size) return stages;
  const lamps = [...run.shards.entries()]
    .sort((a, b) => String(a[0]).localeCompare(String(b[0])))
    .map(([sid, st]) => '<span class="shard-lamp s-' + esc(st) + '" title="' +
      esc(sid + " · " + st) + '"></span>');
  const done = [...run.shards.values()].filter((s) => s === "done").length;
  return '<span class="sub">' + done + "/" + run.shards.size + " shards" +
    (run.merged ? " · " + run.merged + " merged" : "") +
    (run.rounds ? ' <span class="rounds">&#8635; R' + run.rounds + "</span>" : "") +
    "</span>" + '<div class="sidings">' + lamps.join("") + "</div>";
}

const LAMP_FOR = { done:"on-green", active:"on-amber", failed:"on-red",
                   parked:"on-violet", idle:"" };

function headLamp(run) {
  if (run.state === "halted") return "on-red";
  if (run.state === "parked") return "on-violet";
  if (run.state === "stopped") return "on-green";
  return "on-amber";
}

function renderRun(run, now) {
  // The flash is time-bounded rather than latched, so the 15s idle re-render
  // that keeps the age column honest does not replay it.
  const hot = run.pulse && now - run.pulse.at < 1200 ? run.pulse : null;

  const track = BLOCKS.map((b) => {
    const st = run.blocks[b];
    // A measured wait, not just a dimmed rail. A judging node can be silent for
    // minutes, and "waiting 2m40s" is the difference between a slow run and a
    // dead one — the only distinction the card could not previously make.
    const sub = st === "waiting" && run.waiting[b]
      ? '<span class="sub"><span class="await">waiting ' +
          esc(elapsed(now - run.waiting[b])) + "</span></span>"
      : b === "build" ? shardSidings(run)
      : (b === "plan" && run.attempt > 1 ? '<span class="sub">attempt ' + run.attempt + "</span>" : "");
    const n = run.counts[b] || 0;
    const flash = hot && hot.block === b ? " pulse sev-" + esc(hot.sev) : "";
    return '<div class="block ' + esc(st) + flash + '"><span class="lamp ' +
      esc(LAMP_FOR[st] || "") + '"></span>' +
      (n ? '<span class="bcount">' + n + "</span>" : "") +
      '<span class="bname">' + esc(b) + "</span>" + sub + "</div>";
  }).join("");

  const tick = run.tick
    ? '<div class="tick sev-' + esc(run.tick.sev) + (hot ? " fresh" : "") + '">' +
        '<span class="tdot"></span>' +
        '<span class="ttime">' +
          new Date(run.tick.at).toLocaleTimeString([], { hour12:false }) + "</span>" +
        '<span class="ttype">' + esc(run.tick.type) + "</span>" +
        '<span class="tcount">' + run.events + " events</span>" +
      "</div>"
    : "";

  const attention = run.state === "halted" ||
    [...run.shards.values()].some((s) => s === "escalated");

  return '<article class="run ' + (attention ? "attention " : "") +
    (selected === run.key ? "selected" : "") + '">' +
    '<button type="button" class="run-head" data-select="' + esc(run.key) + '">' +
      '<span class="lamp ' + headLamp(run) + '"></span>' +
      '<span class="run-title"><span class="repo">' + esc(run.repo) + "</span> " +
        esc(run.issue != null ? "#" + run.issue : run.key) +
        (run.title ? ' <span class="repo">' + esc(run.title) + "</span>" : "") + "</span>" +
      '<span class="livery ' + esc(run.state) + '">' + esc(run.state) + "</span>" +
      '<span class="run-age">' + age(now, run.last) + " ago</span>" +
    "</button>" +
    '<div class="track">' + track + "</div>" + tick +
    '<div class="verdict ' + esc(run.verdict.cls) + '"><b>' + esc(run.verdict.label) + "</b>" +
      "<span>" + esc(run.verdict.detail) + "</span></div>" +
    '<details class="drawer"' + (openDrawers.has(run.key) ? " open" : "") +
      ' data-run="' + esc(run.key) + '"><summary>details</summary>' +
      '<div class="drawer-body">' +
        '<div class="idline"><b>run</b> ' + esc(run.key) + "</div>" +
        '<div class="idline"><b>worktree</b> ' + esc(run.worktree || "not created") + "</div>" +
        '<div class="idline"><b>base</b> ' + esc(run.base || "unknown") + "</div>" +
        (run.suite ? '<div class="idline"><b>suite</b> ' + esc(run.suite) + "</div>" : "") +
        (run.pr ? '<div class="idline"><b>pr</b> ' + esc(run.pr) + "</div>" : "") +
        (run.notes.length ? '<div class="idline"><b>notes</b> ' + esc(run.notes.join(", ")) + "</div>" : "") +
        '<div class="idline"><b>started</b> ' + new Date(run.first).toLocaleTimeString() + "</div>" +
      "</div></details>" +
    "</article>";
}

function renderBoard() {
  const board = document.getElementById("board");
  const now = Date.now();
  if (!runs.size) {
    board.innerHTML = '<div class="empty">No runs yet. Launch one with ' +
      "<code>signalbox launch &lt;issue&gt; --repo-path &lt;path&gt;</code>.</div>";
    return;
  }
  const byRepo = new Map();
  for (const run of runs.values()) {
    if (!byRepo.has(run.repo)) byRepo.set(run.repo, []);
    byRepo.get(run.repo).push(run);
  }
  const sections = [...byRepo.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  board.innerHTML = sections.map(([repo, list]) => {
    list.sort((a, b) => b.last - a.last);
    const live = list.filter((r) => r.state === "running" || r.state === "parked").length;
    return "<section>" +
      '<div class="section-head"><span class="plate">' + esc(repo) + "</span>" +
      '<span class="count">' + list.length + " run" + (list.length === 1 ? "" : "s") +
      (live ? " · " + live + " live" : "") + "</span></div>" +
      list.map((r) => renderRun(r, now)).join("") + "</section>";
  }).join("");
}

function renderFeed() {
  const el = document.getElementById("feed");
  const shown = feed.filter((e) => !filter || sev(e.type) === filter).slice(0, 250);
  if (!shown.length) { el.innerHTML = '<div class="empty">No events match.</div>'; return; }
  el.innerHTML = shown.map((e) => {
    const invocation = invocationFor(e);
    const badge = invocation
      ? '<span class="badge">' + esc(invocation.runner) +
        (invocation.model == null ? "" : " · " + esc(invocation.model)) + "</span>"
      : "";
    return '<div class="ev sev-' + esc(sev(e.type)) + '">' +
      '<div class="hd"><span>' + new Date(e.timestamp).toLocaleTimeString([], { hour12:false }) +
      '</span><span class="ty">' + esc(e.type) + "</span><span>" + esc(e.source || "") +
      "</span>" + badge + "</div>" +
      '<div class="bd">' + esc(e.summary) + "</div></div>";
  }).join("");
}

const KEEP = ["run_id","stage_id","shard_id","path","verdict","decision","outcome",
              "reason","conclusion","note","pr","expected","received","error","attempt"];

function summarise(p) {
  if (!p || typeof p !== "object") return "";
  const out = [];
  for (const k of KEEP) {
    let v = p[k];
    if (v === undefined || v === null) continue;
    if (Array.isArray(v)) v = "[" + v.length + "]";
    else if (typeof v === "object") v = JSON.stringify(v).slice(0, 60);
    out.push(k + "=" + v);
  }
  const extra = p.violations || p.findings;
  if (Array.isArray(extra) && extra.length) {
    out.push(String(typeof extra[0] === "string" ? extra[0] : JSON.stringify(extra[0])).slice(0, 90));
  }
  return out.join("  ");
}

/* The filter names ARE the five meanings, so the legend that explains the
   register also explains the card. An `unmapped` chip appears only once such an
   event has actually arrived, where it reads as the alarm it is. */
const SEV_LABEL = { go:"finished", work:"working", judge:"judging",
                    stop:"stopped", hold:"waiting", unmapped:"unmapped" };

function renderBadges() {
  const present = new Set(feed.map((e) => sev(e.type)));
  const kinds = SEVERITIES.concat(present.has("unmapped") ? ["unmapped"] : []);
  document.getElementById("badges").innerHTML =
    '<button class="badge' + (filter ? "" : " on") + '" data-filter="">all</button>' +
    kinds.map((k) =>
      '<button class="badge sev-' + k + (filter === k ? " on" : "") +
      '" data-filter="' + k + '">' + SEV_LABEL[k] + "</button>").join("");
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-filter]");
  if (b) { filter = b.dataset.filter || null; renderBadges(); renderFeed(); return; }
  const s = e.target.closest("[data-select]");
  if (s) { selected = selected === s.dataset.select ? null : s.dataset.select; renderBoard(); }
});
document.addEventListener("toggle", (e) => {
  const d = e.target.closest("details.drawer");
  if (!d) return;
  if (d.open) openDrawers.add(d.dataset.run); else openDrawers.delete(d.dataset.run);
}, true);

/* ── streams ──────────────────────────────────────────────────────────
   Several engines can be watched at once: ?streams=8101,8201 or full URLs.
   Each is an independent EventSource; the board merges them by run_id.     */

function streamUrls() {
  const q = new URLSearchParams(location.search).get("streams");
  const parts = (q || "8101").split(",").map((s) => s.trim()).filter(Boolean);
  return parts.map((p) => (/^https?:/.test(p) ? p : "http://127.0.0.1:" + p + "/events"));
}

const health = new Map();

// Traffic that exists to keep the stream open, not to be shown.
const HEARTBEAT = new Set(["exec.output", "exec.exit"]);
let lastByte = 0;

function meta() {
  const up = [...health.values()].filter(Boolean).length;
  const total = health.size;
  const lamp = document.getElementById("stream-lamp");
  lamp.className = "lamp " + (up === total ? "on-green" : up ? "on-amber" : "on-red");
  // Say which of the two silences this is. A stream that has never delivered a
  // byte is the case that used to read as a broken dashboard.
  let state;
  if (!up) state = "no stream";
  else if (!lastByte) state = "waiting for first event";
  else state = totalEvents + " events";
  document.getElementById("meta-text").textContent =
    up + "/" + total + " stream" + (total === 1 ? "" : "s") + " · " +
    runs.size + " run" + (runs.size === 1 ? "" : "s") + " · " + state +
    // Named rather than hidden: these are on the wire and in the register, and
    // the board cannot place them because they carry no run to place them in.
    (unattributed ? " · " + unattributed + " unattributed" : "");
}

let dirty = false;
let pending = false;   // one trailing render, to take a spent flash back off
function schedule() { dirty = true; }
// 800ms is inside the 1200ms pulse window, so no event's flash is missed; the
// extra pass 1s later is what clears a flash when nothing follows it.
// A wait counter has to move on its own, since the whole point is that no event
// is arriving to move it. Without this the 15s pass below would advance it in
// jumps, which reads as a frozen page during exactly the silence it explains.
const anyWaiting = () =>
  [...runs.values()].some((r) => Object.keys(r.waiting).length > 0);
setInterval(() => {
  if (dirty) { dirty = false; renderBoard(); renderFeed(); renderBadges(); pending = true; }
  else if (pending || anyWaiting()) { pending = false; renderBoard(); }
  meta();
}, 800);
setInterval(renderBoard, 15000);   // keep the age column honest while idle

for (const url of streamUrls()) {
  health.set(url, false);
  const es = new EventSource(url);
  es.onopen = () => { health.set(url, true); meta(); };
  es.onerror = () => { health.set(url, false); meta(); };
  es.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (_) { return; }
    if (!msg || !msg.type) return;
    // The stream's headers do not flush until its first event, so an idle
    // engine is indistinguishable from a dead one in the browser. The interval
    // sources' exec.output is subscribed purely so that never happens: any byte
    // proves the fabric is alive, so mark it and drop it.
    if (HEARTBEAT.has(msg.type)) { lastByte = Date.now(); health.set(url, true); meta(); return; }
    msg.timestamp = msg.timestamp || Date.now();
    lastByte = Date.now();
    if (isProvenance(msg)) { recordProvenance(msg.payload || {}); schedule(); return; }
    totalEvents++;
    // The register takes every event. The board takes only the ones that name a
    // run, because a card is a claim that a run exists.
    if (isAttributed(msg)) apply(msg);
    else unattributed++;
    feed.unshift({ type: msg.type, source: msg.source, timestamp: msg.timestamp,
                   summary: summarise(msg.payload), ...identity(msg.payload) });
    if (feed.length > 1000) feed.length = 1000;
    document.getElementById("feed-empty")?.remove();
    schedule();
  };
}

renderBadges();
renderBoard();
meta();
</script>
