<!doctype html>
<meta charset="utf-8">
<title>signalbox</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --fg: #16150f; --dim: #6b6a62; --line: #e3e2dc; --card: #fff;
    --ok: #1a7f4b; --warn: #a86a00; --bad: #b3261e; --act: #2b4c8c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#131311; --fg:#eceae2; --dim:#8f8d84; --line:#2b2a26; --card:#1b1a17;
            --ok:#5ec98d; --warn:#e0a33c; --bad:#ef8279; --act:#8ab0f0; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-sans-serif,system-ui,sans-serif; }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line);
           padding:14px 20px; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; z-index:2; }
  h1 { font-size:15px; margin:0; letter-spacing:.02em; }
  .status { font-size:12px; color:var(--dim); }
  .status.live::before { content:"●"; color:var(--ok); margin-right:5px; }
  .status.down::before { content:"●"; color:var(--bad); margin-right:5px; }
  main { padding:16px 20px 60px; }
  .run { border:1px solid var(--line); border-radius:8px; background:var(--card); margin-bottom:16px; overflow:hidden; }
  .run > summary { padding:10px 14px; cursor:pointer; font-weight:600; display:flex; gap:10px; align-items:center; }
  .run > summary::marker { color:var(--dim); }
  .count { font-weight:400; color:var(--dim); font-size:12px; }
  table { width:100%; border-collapse:collapse; font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
  td { padding:5px 10px; border-top:1px solid var(--line); vertical-align:top; }
  td.t { white-space:nowrap; color:var(--dim); width:1%; }
  td.ty { white-space:nowrap; font-weight:600; width:1%; }
  td.src { white-space:nowrap; color:var(--dim); width:1%; }
  td.p { color:var(--dim); word-break:break-word; }
  tr.ok td.ty { color:var(--ok); }
  tr.bad td.ty { color:var(--bad); }
  tr.warn td.ty { color:var(--warn); }
  tr.act td.ty { color:var(--act); }
  .empty { color:var(--dim); padding:40px 0; text-align:center; }
</style>
<header>
  <h1>signalbox</h1>
  <span class="status" id="status">connecting…</span>
  <span class="status" id="tally"></span>
  <span class="status" style="margin-left:auto"><a href="http://localhost:8102" style="color:inherit">topology →</a></span>
</header>
<main><div class="empty" id="empty">Waiting for events. Launch a run with <code>signalbox launch &lt;issue&gt;</code>.</div></main>
<script>
const BAD  = /halted|failed|violated|blocked|invalid|conflicted|abandoned|escalated|silent|unknown-event/;
const OK   = /completed|approved|merged|passed|cleared|synced|ready|accepted/;
const WARN = /requested|changes|reopen|rejected|retry/;
const runs = new Map();
const main = document.querySelector("main");
const empty = document.getElementById("empty");
let total = 0;

function classify(type) {
  if (BAD.test(type)) return "bad";
  if (OK.test(type)) return "ok";
  if (WARN.test(type)) return "warn";
  return "act";
}

function summarise(p) {
  if (!p || typeof p !== "object") return "";
  const keep = ["shard_id","stage_id","path","verdict","decision","outcome","reason",
                "violations","findings","conclusion","note","pr","expected","received","error"];
  const parts = [];
  for (const k of keep) {
    if (p[k] === undefined || p[k] === null) continue;
    let v = p[k];
    if (Array.isArray(v)) v = v.length ? `[${v.length}] ${JSON.stringify(v[0]).slice(0,60)}` : "[]";
    else if (typeof v === "object") v = JSON.stringify(v).slice(0, 80);
    parts.push(`${k}=${v}`);
  }
  return parts.join("  ");
}

function runBox(id) {
  if (runs.has(id)) return runs.get(id);
  empty.remove?.();
  const box = document.createElement("details");
  box.className = "run"; box.open = true;
  box.innerHTML = `<summary>${id} <span class="count">0 events</span></summary><table><tbody></tbody></table>`;
  main.prepend(box);
  const entry = { box, body: box.querySelector("tbody"), count: box.querySelector(".count"), n: 0 };
  runs.set(id, entry);
  return entry;
}

function add(msg) {
  const p = msg.payload || {};
  const entry = runBox(p.run_id || "unattributed");
  const tr = document.createElement("tr");
  tr.className = classify(msg.type);
  const time = new Date(msg.timestamp).toLocaleTimeString([], {hour12:false});
  tr.innerHTML = `<td class="t">${time}</td><td class="ty">${msg.type}</td>` +
                 `<td class="src">${msg.source || ""}</td><td class="p"></td>`;
  tr.lastElementChild.textContent = summarise(p);
  entry.body.prepend(tr);
  entry.count.textContent = `${++entry.n} events`;
  document.getElementById("tally").textContent = `${++total} events · ${runs.size} runs`;
}

function connect() {
  const es = new EventSource("http://127.0.0.1:8101/events");
  const status = document.getElementById("status");
  es.onopen = () => { status.textContent = "live"; status.className = "status live"; };
  es.onmessage = (e) => { try { add(JSON.parse(e.data)); } catch (_) {} };
  es.onerror = () => { status.textContent = "disconnected — retrying"; status.className = "status down"; };
}
connect();
</script>
